<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户服务与权限 · NovaCross</title><link rel="stylesheet" href="assets/styles.css"></head><body data-surface="shop" data-page="shop-customer" data-title="客户服务与权限" data-crumb="客户与设置 / 客户服务与权限"><aside class="app-nav" id="app-nav"></aside><div class="app-main"><header class="app-topbar" id="app-topbar"></header><main class="app-content"><div class="section-head"><div><div class="eyebrow">CUSTOMER OPERATIONS</div><h2 class="h1">客户服务与权限</h2><p class="lead">统一处理客户咨询、评价、会员运营与团队权限。</p></div><button class="btn primary" id="newAccount" type="button">+ 添加子账号</button></div><div class="grid cols-4 mb-24"><div class="kpi"><span class="kpi-label">待回复咨询</span><div class="kpi-value" id="chatKpi">18</div><span class="kpi-delta down">需尽快处理</span></div><div class="kpi"><span class="kpi-label">待回复评价</span><div class="kpi-value" id="reviewKpi">9</div><div class="tiny muted">含 2 条差评</div></div><div class="kpi"><span class="kpi-label">店铺会员</span><div class="kpi-value">12,486</div><span class="kpi-delta up">↗ 16.2%</span></div><div class="kpi"><span class="kpi-label">客服响应率</span><div class="kpi-value">98.6%</div><div class="tiny muted">平均 42 秒响应</div></div></div><div class="grid cols-2" style="align-items:start"><section class="panel"><div class="panel-head"><div class="seg" id="tabs"><button class="active" data-tab="chat" type="button">在线咨询</button><button data-tab="review" type="button">评价管理</button><button data-tab="member" type="button">会员分层</button></div></div><div class="panel-body" id="serviceList"></div></section><section class="panel"><div class="panel-head"><div class="panel-title">快捷回复</div><button class="btn ghost sm" id="newReply" type="button">+ 新建</button></div><div class="panel-body" id="replies"></div></section></div><section class="panel mt-24"><div class="panel-head"><div class="panel-title">子账号与权限</div><span class="tiny muted" id="accountCount"></span></div><div class="panel-body" id="accounts"></div></section></main></div><div class="drawer-mask" id="mask"></div><div class="drawer" id="drawer"><div class="drawer-head"><h3 class="h3" id="accountDrawerTitle">添加店铺子账号</h3><button class="icon-btn" id="close" type="button">×</button></div><div class="drawer-body"><div class="stack"><label>姓名<input class="input" id="accountName" placeholder="例如：李明"></label><label>邮箱<input class="input" id="accountEmail" type="email" placeholder="name@example.com"></label><label>角色<select class="select" id="accountRole"><option>客服</option><option>运营</option><option>仓储</option><option>财务</option><option>店铺管理员</option></select></label><label>权限范围<select class="select" id="accountScope"><option>仅查看</option><option>可编辑</option><option>全部权限</option></select></label></div></div><div class="drawer-foot"><button class="btn" id="cancel" type="button">取消</button><button class="btn primary" id="save" type="button">保存账号</button></div></div><div class="drawer" id="serviceDrawer"><div class="drawer-head"><h3 class="h3" id="serviceTitle">处理客户</h3><button class="icon-btn" data-close-drawer="serviceDrawer" type="button">×</button></div><div class="drawer-body"><div class="panel mb-16"><div class="panel-body"><b id="serviceSubject"></b><div class="tiny muted mt-8" id="serviceMeta"></div></div></div><label>回复内容<textarea class="input" id="serviceReply" rows="5" placeholder="请输入回复内容"></textarea></label></div><div class="drawer-foot"><button class="btn" data-close-drawer="serviceDrawer" type="button">取消</button><button class="btn primary" id="sendService" type="button">发送回复</button></div></div><div class="drawer" id="replyDrawer"><div class="drawer-head"><h3 class="h3" id="replyDrawerTitle">新建快捷回复</h3><button class="icon-btn" data-close-drawer="replyDrawer" type="button">×</button></div><div class="drawer-body"><label>回复内容<textarea class="input" id="replyText" rows="5" placeholder="输入常用回复内容"></textarea></label></div><div class="drawer-foot"><button class="btn" data-close-drawer="replyDrawer" type="button">取消</button><button class="btn primary" id="saveReply" type="button">保存回复</button></div></div><div class="drawer" id="permissionDrawer"><div class="drawer-head"><h3 class="h3">编辑账号权限</h3><button class="icon-btn" data-close-drawer="permissionDrawer" type="button">×</button></div><div class="drawer-body"><div class="tiny muted mb-16" id="permissionName"></div><div class="stack"><label>角色<select class="select" id="permissionRole"><option>客服</option><option>运营</option><option>仓储</option><option>财务</option><option>店铺管理员</option></select></label><label>权限范围<select class="select" id="permissionScope"><option>仅查看</option><option>可编辑</option><option>全部权限</option></select></label><label class="row" style="gap:8px"><input type="checkbox" id="permissionEnabled"> 账号启用</label></div></div><div class="drawer-foot"><button class="btn" data-close-drawer="permissionDrawer" type="button">取消</button><button class="btn primary" id="savePermission" type="button">保存权限</button></div></div><script src="assets/icons.js"></script><script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/app.js"></script><script src="assets/shell.js"></script><script>(function(){var tab='chat',editingReply=-1,editingAccount=-1,serviceIndex=-1,accounts=[{name:'杨琳',email:'yanglin@novacross.com',role:'店铺管理员',scope:'全部权限',status:'启用'},{name:'王强',email:'wangqiang@novacross.com',role:'仓储',scope:'可编辑',status:'启用'},{name:'周敏',email:'zhoumin@novacross.com',role:'客服',scope:'可编辑',status:'启用'}],data={chat:[['C-10284','请问这款耳机什么时候可以发货？','2 分钟前','待回复'],['C-10281','想修改收货地址，订单还没发货','18 分钟前','待回复'],['C-10276','商品已经收到了，谢谢！','1 小时前','已回复']],review:[['订单 NC-20261018-1042','音质很好，物流也很快','5 分钟前','待回复'],['订单 NC-20261017-0988','包装破损，客服处理较慢','昨天','差评待处理'],['订单 NC-20261016-0912','整体满意，会再次购买','昨天','已回复']],member:[['高价值会员','近 90 天消费超过 $500','1,284 人','重点维护'],['活跃会员','近 30 天有下单行为','6,420 人','常规触达'],['沉睡会员','90 天未下单','4,782 人','召回营销']]},replies=['您好，已为您查询订单状态','很抱歉给您带来不便，我们马上处理','您的包裹预计将在 3-5 个工作日送达'];function esc(s){return FMT.esc(String(s))}function openDrawer(id){document.getElementById(id).classList.add('open');document.getElementById('mask').classList.add('open')}function closeDrawers(){document.querySelectorAll('.drawer').forEach(function(x){x.classList.remove('open')});document.getElementById('mask').classList.remove('open')}function updateKpi(){document.getElementById('chatKpi').textContent=data.chat.filter(function(x){return x[3]!=='已回复'}).length+15;document.getElementById('reviewKpi').textContent=data.review.filter(function(x){return x[3]!=='已回复'}).length+7}function renderService(){document.getElementById('serviceList').innerHTML=data[tab].map(function(x,i){var actionable=tab==='member'?'触达':x[3]==='已回复'?'查看':'处理';return '<div class="row between mb-16 wrap" style="gap:12px"><div><b>'+esc(x[0])+'</b><div class="tiny muted mt-8">'+esc(x[1])+' · '+esc(x[2])+' · '+esc(x[3])+'</div></div><button class="btn ghost sm" data-service="'+i+'" type="button">'+actionable+'</button></div>'}).join('');document.querySelectorAll('[data-service]').forEach(function(b){b.onclick=function(){var item=data[tab][Number(b.dataset.service)];if(tab==='member'){UI.toast('已创建 '+item[0]+' 会员触达任务');return}serviceIndex=Number(b.dataset.service);document.getElementById('serviceTitle').textContent=item[3]==='已回复'?'查看处理记录':'处理'+(tab==='review'?'评价':'咨询');document.getElementById('serviceSubject').textContent=item[0];document.getElementById('serviceMeta').textContent=item[1]+' · '+item[2];document.getElementById('serviceReply').value=item[3]==='已回复'?'已完成回复。':'';document.getElementById('sendService').textContent=item[3]==='已回复'?'关闭':'发送回复';openDrawer('serviceDrawer')}})}function renderReplies(){document.getElementById('replies').innerHTML=replies.map(function(x,i){return '<div class="row between mb-16 wrap" style="gap:8px"><span>'+esc(x)+'</span><div class="row" style="gap:6px"><button class="btn ghost sm" data-copy-reply="'+i+'" type="button">复制</button><button class="btn ghost sm" data-edit-reply="'+i+'" type="button">编辑</button><button class="btn ghost sm" data-delete-reply="'+i+'" type="button">删除</button></div></div>'}).join('');document.querySelectorAll('[data-copy-reply]').forEach(function(b){b.onclick=function(){var text=replies[Number(b.dataset.copyReply)];if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){UI.toast('快捷回复已复制')})}else{UI.toast('快捷回复已复制')}}});document.querySelectorAll('[data-edit-reply]').forEach(function(b){b.onclick=function(){editingReply=Number(b.dataset.editReply);document.getElementById('replyDrawerTitle').textContent='编辑快捷回复';document.getElementById('replyText').value=replies[editingReply];openDrawer('replyDrawer')}});document.querySelectorAll('[data-delete-reply]').forEach(function(b){b.onclick=function(){var i=Number(b.dataset.deleteReply);replies.splice(i,1);renderReplies();UI.toast('快捷回复已删除')}})}function renderAccounts(){document.getElementById('accountCount').textContent='共 '+accounts.length+' 个账号';document.getElementById('accounts').innerHTML=accounts.map(function(a,i){return '<div class="row between mb-16 wrap" style="gap:12px"><div class="row" style="gap:10px"><span class="avatar">'+esc(a.name.slice(0,1))+'</span><div><b>'+esc(a.name)+'</b><div class="tiny muted">'+esc(a.email)+' · '+esc(a.role)+' · '+esc(a.scope)+'</div></div></div><div class="row" style="gap:8px"><span class="badge '+(a.status==='启用'?'success':'')+'"><i class="dt"></i>'+a.status+'</span><button class="btn ghost sm" data-account="'+i+'" type="button">权限</button><button class="btn ghost sm" data-toggle-account="'+i+'" type="button">'+(a.status==='启用'?'停用':'启用')+'</button><button class="btn ghost sm" data-delete-account="'+i+'" type="button">删除</button></div></div>'}).join('');document.querySelectorAll('[data-account]').forEach(function(b){b.onclick=function(){editingAccount=Number(b.dataset.account);var a=accounts[editingAccount];document.getElementById('permissionName').textContent=a.name+' · '+a.email;document.getElementById('permissionRole').value=a.role;document.getElementById('permissionScope').value=a.scope;document.getElementById('permissionEnabled').checked=a.status==='启用';openDrawer('permissionDrawer')}});document.querySelectorAll('[data-toggle-account]').forEach(function(b){b.onclick=function(){var a=accounts[Number(b.dataset.toggleAccount)];a.status=a.status==='启用'?'停用':'启用';renderAccounts();UI.toast(a.name+' 已'+a.status)}});document.querySelectorAll('[data-delete-account]').forEach(function(b){b.onclick=function(){var i=Number(b.dataset.deleteAccount),a=accounts[i];accounts.splice(i,1);renderAccounts();UI.toast(a.name+' 已删除')}})}document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;document.querySelectorAll('#tabs button').forEach(function(x){x.classList.toggle('active',x===b)});renderService()}});document.getElementById('newAccount').onclick=function(){editingAccount=-1;document.getElementById('accountDrawerTitle').textContent='添加店铺子账号';document.getElementById('accountName').value='';document.getElementById('accountEmail').value='';openDrawer('drawer')};document.getElementById('newReply').onclick=function(){editingReply=-1;document.getElementById('replyDrawerTitle').textContent='新建快捷回复';document.getElementById('replyText').value='';openDrawer('replyDrawer')};document.querySelectorAll('[data-close-drawer]').forEach(function(b){b.onclick=closeDrawers});document.getElementById('close').onclick=document.getElementById('cancel').onclick=closeDrawers;document.getElementById('mask').onclick=closeDrawers;document.getElementById('save').onclick=function(){var n=document.getElementById('accountName').value.trim(),e=document.getElementById('accountEmail').value.trim();if(!n||!e){UI.toast('请填写姓名和邮箱','error');return}if(!/^\S+@\S+\.\S+$/.test(e)){UI.toast('请输入正确的邮箱地址','error');return}if(accounts.some(function(a,i){return a.email.toLowerCase()===e.toLowerCase()&&i!==editingAccount})){UI.toast('该邮箱已存在','error');return}accounts.push({name:n,email:e,role:document.getElementById('accountRole').value,scope:document.getElementById('accountScope').value,status:'启用'});closeDrawers();renderAccounts();UI.toast('子账号已创建')};document.getElementById('saveReply').onclick=function(){var text=document.getElementById('replyText').value.trim();if(!text){UI.toast('请输入快捷回复内容','error');return}if(editingReply<0){replies.push(text);UI.toast('快捷回复已新增')}else{replies[editingReply]=text;UI.toast('快捷回复已更新')}closeDrawers();renderReplies()};document.getElementById('sendService').onclick=function(){if(data[tab][serviceIndex][3]==='已回复'){closeDrawers();return}var text=document.getElementById('serviceReply').value.trim();if(!text){UI.toast('请输入回复内容','error');return}data[tab][serviceIndex][3]='已回复';closeDrawers();renderService();updateKpi();UI.toast('回复已发送')};document.getElementById('savePermission').onclick=function(){if(editingAccount<0)return;var a=accounts[editingAccount];a.role=document.getElementById('permissionRole').value;a.scope=document.getElementById('permissionScope').value;a.status=document.getElementById('permissionEnabled').checked?'启用':'停用';closeDrawers();renderAccounts();UI.toast('权限配置已保存')};renderService();renderReplies();renderAccounts();updateKpi()})();</script></body></html>
