<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店铺订单 · NovaCross</title><link rel="stylesheet" href="assets/styles.css"></head><body data-surface="shop" data-page="shop-orders" data-title="店铺订单" data-crumb="商品与订单 / 店铺订单"><aside class="app-nav" id="app-nav"></aside><div class="app-main"><header class="app-topbar" id="app-topbar"></header><main class="app-content"><div class="section-head"><div><div class="eyebrow">ORDER DESK</div><h2 class="h1">店铺订单</h2><p class="lead">聚合独立站与平台渠道订单，快速完成发货和售后处理。</p></div><button class="btn" id="export">导出订单</button></div><div class="grid cols-4 mb-24"><div class="kpi"><span class="kpi-label">全部订单</span><div class="kpi-value">1,286</div><span class="kpi-delta up">↗ 8.1%</span></div><div class="kpi"><span class="kpi-label">待发货</span><div class="kpi-value">46</div><span class="kpi-delta down">需尽快处理</span></div><div class="kpi"><span class="kpi-label">运输中</span><div class="kpi-value">238</div><span class="kpi-delta up">正常</span></div><div class="kpi"><span class="kpi-label">售后申请</span><div class="kpi-value">12</div><span class="kpi-delta down">本周 +3</span></div></div><div class="panel"><div class="panel-head"><div class="seg" id="tabs"><button class="active" data-s="all">全部</button><button data-s="PENDING_PAYMENT">待支付</button><button data-s="PAID">待发货</button><button data-s="IN_TRANSIT">运输中</button></div><input class="input" id="q" placeholder="搜索订单号"></div><div class="table-wrap"><table class="table"><thead><tr><th>订单号</th><th>渠道</th><th>买家国家</th><th>金额</th><th>状态</th><th>下单时间</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div><script src="assets/icons.js"></script><script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/app.js"></script><script src="assets/shell.js"></script><script>var state={s:'all'};function render(){var q=document.getElementById('q').value.toLowerCase();API.fetchShopOrders({status:state.s}).then(function(r){var list=r.data.filter(function(o){return !q||o.no.toLowerCase().indexOf(q)>-1;});document.getElementById('rows').innerHTML=list.map(function(o){return '<tr><td class="mono">'+o.no+'</td><td><span class="pill">'+o.channel+'</span></td><td>'+o.country+'</td><td class="num">'+FMT.money(o.amounts.total,o.currency)+'</td><td>'+UI.badge(DB.ORDER_STATUS,o.status)+'</td><td class="tiny muted">'+o.placedAt+'</td><td><button class="btn ghost sm" onclick="location.href=\'order.html?no='+o.no+'\'">查看</button></td></tr>';}).join('');});}document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){document.querySelector('#tabs .active').classList.remove('active');b.classList.add('active');state.s=b.dataset.s;render();};});document.getElementById('q').oninput=render;document.getElementById('export').onclick=function(){UI.toast('订单 CSV 已生成');};render();</script></body></html>
