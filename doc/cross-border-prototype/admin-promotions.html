<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打折促销活动 · NovaCross</title><link rel="stylesheet" href="assets/styles.css"></head><body data-surface="admin" data-page="promotions" data-title="打折促销活动" data-crumb="交易 / 打折促销活动"><aside class="app-nav" id="app-nav"></aside><div class="app-main"><header class="app-topbar" id="app-topbar"></header><main class="app-content"><div class="section-head"><div><div class="eyebrow">PROMOTION STUDIO</div><h2 class="h1">打折促销活动</h2><p class="lead">统一管理直降、满减、优惠券、会员价与社交裂变活动。</p></div><button class="btn primary" id="newPromo" type="button">+ 创建促销活动</button></div><div class="grid cols-4 mb-24" id="kpis"></div><section class="panel mb-24"><div class="panel-head"><div class="panel-title">促销机制</div><span class="tiny muted">按活动类型筛选</span></div><div class="panel-body"><div class="row wrap" style="gap:8px" id="filters"></div></div></section><section class="panel"><div class="panel-head"><div class="panel-title">活动计划</div><span class="tiny muted" id="count"></span></div><div class="panel-body" id="list"></div></section></main></div><div class="drawer-mask" id="mask"></div><div class="drawer" id="drawer"><div class="drawer-head"><h3 class="h3">创建促销活动</h3><button class="icon-btn" id="close" type="button">×</button></div><div class="drawer-body"><div class="stack"><label>活动名称<input class="input" id="name" placeholder="例如：年终大促官方立减"></label><label>促销类型<select class="select" id="type"><option>直降折扣</option><option>限时秒杀</option><option>满减活动</option><option>优惠券</option><option>会员价</option><option>拼团 / 裂变</option><option>满赠活动</option></select></label><label>优惠规则<input class="input" id="rule" placeholder="例如：全场 9 折 / 满 $300 减 $50"></label><div class="grid cols-2"><label>开始日期<input class="input" id="start" type="date" value="2026-11-01"></label><label>结束日期<input class="input" id="end" type="date" value="2026-11-30"></label></div><label>适用范围<select class="select" id="scope"><option>全店商品</option><option>指定商品</option><option>指定品类</option><option>新客专享</option><option>会员专享</option></select></label><div class="field"><span>活动商品与 SKU</span><div class="select" id="productPicker" role="group" aria-label="选择活动商品"></div><div class="tiny muted" id="skuHint">全店商品活动无需指定 SKU</div></div></div></div><div class="drawer-foot"><button class="btn" id="cancel" type="button">取消</button><button class="btn primary" id="save" type="button">保存草稿</button></div></div><script src="assets/icons.js"></script><script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/app.js"></script><script src="assets/shell.js"></script><script>
(function(){var rows=[{name:'黑五提前购 · 官方立减',type:'直降折扣',rule:'全场 85 折',status:'进行中',date:'2026-10-15 至 2026-11-30',scope:'全店商品',used:1842,sales:48620},{name:'新客首单礼',type:'优惠券',rule:'满 $80 减 $15',status:'进行中',date:'2026-10-01 至 2026-12-31',scope:'新客专享',used:928,sales:23640},{name:'跨店满减 · 秋季出行',type:'满减活动',rule:'每满 $300 减 $50',status:'草稿',date:'2026-11-01 至 2026-11-15',scope:'数码 / 运动品类',used:0,sales:0},{name:'会员日专享价',type:'会员价',rule:'会员额外 9 折',status:'已结束',date:'2026-09-20 至 2026-09-22',scope:'会员商品池',used:1284,sales:31980}],filter='全部',types=['全部','直降折扣','限时秒杀','满减活动','优惠券','会员价','拼团 / 裂变','满赠活动'],selectedProduct='',selectedSku='';function esc(s){return FMT.esc(String(s))}function productVariants(p){var sizes=p.sizes&&p.sizes.length?p.sizes:['标准'];var total=Math.max(1,p.colors.length*sizes.length);var result=[];p.colors.forEach(function(color,c){sizes.forEach(function(size,s){var index=c*sizes.length+s,stock=Object.keys(p.stock||{}).reduce(function(n,w){return n+(Math.floor((p.stock[w]||0)/total)+(index<(p.stock[w]||0)%total?1:0))},0);result.push({sku:index===0?p.sku:p.spu.replace('SPU-','SKU-')+'-C'+(c+1)+'-S'+(s+1),label:color+(p.sizes&&p.sizes.length?' / '+size:''),stock:stock})})});return result}function renderProductPicker(){var picker=document.getElementById('productPicker'),hint=document.getElementById('skuHint');if(document.getElementById('scope').value!=='指定商品'){picker.innerHTML='<span class="tiny muted">选择“指定商品”后配置活动 SKU</span>';hint.textContent='全店、品类、会员及新客活动按范围生效';selectedProduct='';selectedSku='';return}picker.innerHTML='<div class="stack" style="gap:8px"><select class="select" id="productSelect"><option value="">请选择商品</option>'+DB.PRODUCTS.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('')+'</select><div id="skuOptions" class="row wrap" style="gap:6px"></div></div>';document.getElementById('productSelect').onchange=function(){selectedProduct=this.value;selectedSku='';var p=DB.PRODUCTS.find(function(x){return x.id===selectedProduct}),box=document.getElementById('skuOptions');if(!p){box.innerHTML='';hint.textContent='请选择商品后配置活动 SKU';return}box.innerHTML=productVariants(p).map(function(v){return '<button type="button" class="btn sm '+(v.stock?'':'disabled')+'" data-sku="'+esc(v.sku)+'" '+(v.stock?'':'disabled')+'>'+esc(v.label)+' · '+v.stock+' 件</button>'}).join('');box.querySelectorAll('[data-sku]').forEach(function(b){b.onclick=function(){selectedSku=b.dataset.sku;box.querySelectorAll('[data-sku]').forEach(function(x){x.classList.remove('primary')});b.classList.add('primary');hint.textContent='已选择 '+p.name+' · '+b.textContent}});hint.textContent='请选择一个有库存 SKU'};}
function render(){var a=rows.filter(function(x){return filter==='全部'||x.type===filter});document.getElementById('count').textContent='共 '+a.length+' 个活动';document.getElementById('list').innerHTML=a.length?a.map(function(x){return '<div class="card mb-16"><div class="row between wrap"><div><span class="badge '+(x.status==='进行中'?'success':x.status==='草稿'?'warning':'neutral')+'"><i class="dt"></i>'+x.status+'</span> <span class="pill">'+esc(x.type)+'</span><h3 class="h3 mt-8">'+esc(x.name)+'</h3><div class="tiny muted">'+x.date+' · '+esc(x.scope)+(x.sku?' · '+esc(x.sku):'')+'</div></div><button class="btn ghost sm" data-view="'+esc(x.name)+'" type="button">查看详情</button></div><div class="grid cols-3 mt-16"><div><small>优惠规则</small><b>'+esc(x.rule)+'</b></div><div><small>参与 / 核销</small><b>'+x.used.toLocaleString()+'</b></div><div><small>带来销售额</small><b>$'+x.sales.toLocaleString()+'</b></div></div></div>'}).join(''):'<div class="empty"><b>暂无匹配活动</b><span class="tiny">可切换促销机制或创建新活动</span></div>';document.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){UI.toast(b.dataset.view+' · 活动详情已打开')}})}document.getElementById('filters').innerHTML=types.map(function(x){return '<button class="btn sm '+(x===filter?'primary':'')+'" data-filter="'+x+'" type="button">'+x+'</button>}).join('');document.querySelectorAll('[data-filter]').forEach(function(b){b.onclick=function(){filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(function(x){x.classList.toggle('primary',x===b)});render()}});document.getElementById('kpis').innerHTML='<div class="kpi"><span class="kpi-label">进行中活动</span><div class="kpi-value">2</div><div class="tiny muted">直降 + 优惠券</div></div><div class="kpi"><span class="kpi-label">活动带来销售额</span><div class="kpi-value">$104,240</div><span class="kpi-delta up">↗ 21.8%</span></div><div class="kpi"><span class="kpi-label">优惠核销</span><div class="kpi-value">4,054</div><div class="tiny muted">较上周期 +14.2%</div></div><div class="kpi"><span class="kpi-label">规则覆盖</span><div class="kpi-value">7 类</div><div class="tiny muted">价格 / 用户 / 社交 / 内容</div></div>';function toggle(v){document.getElementById('drawer').classList.toggle('open',v);document.getElementById('mask').classList.toggle('open',v)}document.getElementById('scope').onchange=renderProductPicker;document.getElementById('newPromo').onclick=function(){renderProductPicker();toggle(true)};document.getElementById('close').onclick=document.getElementById('cancel').onclick=function(){toggle(false)};document.getElementById('mask').onclick=function(){toggle(false)};document.getElementById('save').onclick=function(){var n=document.getElementById('name').value.trim(),r=document.getElementById('rule').value.trim(),scope=document.getElementById('scope').value;if(!n||!r){UI.toast('请填写活动名称和优惠规则','error');return}if(scope==='指定商品'&&(!selectedProduct||!selectedSku)){UI.toast('请选择商品和有库存的 SKU','error');return}rows.unshift({name:n,type:document.getElementById('type').value,rule:r,status:'草稿',date:document.getElementById('start').value+' 至 '+document.getElementById('end').value,scope:scope,sku:selectedSku,used:0,sales:0});toggle(false);render();UI.toast('促销活动已保存为草稿')};renderProductPicker();render()})();
</script></body></html>
