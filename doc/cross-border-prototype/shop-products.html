<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店铺商品 · NovaCross</title><link rel="stylesheet" href="assets/styles.css"></head><body data-surface="shop" data-page="shop-products" data-title="店铺商品" data-crumb="商品与订单 / 店铺商品"><aside class="app-nav" id="app-nav"></aside><div class="app-main"><header class="app-topbar" id="app-topbar"></header><main class="app-content"><div class="section-head"><div><div class="eyebrow">CATALOG</div><h2 class="h1">店铺商品</h2><p class="lead">管理本店铺销售的商品、价格和渠道状态。</p></div><button class="btn primary" id="addProduct">+ 添加商品</button></div><div class="panel"><div class="panel-head"><div class="row"><input class="input" id="search" placeholder="搜索商品名 / SKU"><select class="select" id="status"><option value="all">全部状态</option><option value="ON_SALE">在售</option><option value="PAUSED">暂停</option></select></div><span class="tiny muted" id="count"></span></div><div class="table-wrap"><table class="table"><thead><tr><th>商品</th><th>SKU</th><th>类目</th><th>店铺价</th><th>库存</th><th>状态</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div><script src="assets/icons.js"></script><script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/app.js"></script><script src="assets/shell.js"></script><script>function render(){var q=document.getElementById('search').value.toLowerCase(),s=document.getElementById('status').value;var list=DB.PRODUCTS.filter(function(p){return(!q||(p.name+p.sku).toLowerCase().indexOf(q)>-1)&& (s==='all'||p.status===s);});document.getElementById('count').textContent=list.length+' 个商品';document.getElementById('rows').innerHTML=list.map(function(p){var stock=Object.keys(p.stock).reduce(function(a,k){return a+p.stock[k];},0);return '<tr><td><div class="row"><div class="table-thumb">'+UI.imgTag(p.images[0],p.name,'',p.name)+'</div><div><b>'+p.name+'</b><small>'+p.brand+'</small></div></div></td><td class="mono">'+p.sku+'</td><td>'+p.categoryLabel+'</td><td class="price">'+FMT.money(p.price.USD,'USD')+'</td><td class="num">'+stock+'</td><td>'+UI.badge(DB.PRODUCT_STATUS,p.status)+'</td><td><button class="btn ghost sm" onclick="UI.toast(\'商品编辑抽屉已打开\')">编辑</button></td></tr>';}).join('');}document.getElementById('search').oninput=render;document.getElementById('status').onchange=render;document.getElementById('addProduct').onclick=function(){UI.toast('新建商品流程已打开');};render();</script></body></html>
