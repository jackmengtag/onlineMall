<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>渠道配置 · NovaCross</title><link rel="stylesheet" href="assets/styles.css"></head><body data-surface="platform" data-page="platform-channels" data-title="渠道配置" data-crumb="平台运营 / 渠道配置"><aside class="app-nav" id="app-nav"></aside><div class="app-main"><header class="app-topbar" id="app-topbar"></header><main class="app-content"><div class="section-head"><div><div class="eyebrow">CHANNEL HUB</div><h2 class="h1">渠道配置</h2><p class="lead">配置销售渠道、授权连接和订单同步策略。</p></div><button class="btn primary" id="connect" type="button">连接新渠道</button></div><div class="grid cols-3 mb-24"><div class="kpi"><span class="kpi-label">已连接渠道</span><div class="kpi-value" id="channel-total">0</div><span class="kpi-delta up">持续同步中</span></div><div class="kpi"><span class="kpi-label">在线渠道</span><div class="kpi-value" id="channel-online">0</div><span class="kpi-delta">授权状态正常</span></div><div class="kpi"><span class="kpi-label">待处理同步</span><div class="kpi-value" id="channel-sync">0</div><span class="kpi-delta down">建议及时检查</span></div></div><div class="row mb-16" style="gap:8px"><input class="input" id="channel-search" placeholder="搜索渠道名称 / 国家"><select class="select" id="channel-filter"><option>全部状态</option><option>在线</option><option>同步中</option><option>已暂停</option></select></div><div class="grid cols-3" id="channels"></div></main></div><div class="drawer-mask" id="mask"></div><div class="drawer" id="channel-drawer"><div class="drawer-head"><h3 class="h3" id="drawer-title">渠道连接配置</h3><button class="icon-btn" id="close" type="button">×</button></div><div class="drawer-body"><div class="stack"><label>渠道名称<input class="input" id="channel-name" placeholder="例如：Amazon US"></label><label>渠道类型<select class="select" id="channel-type"><option>第三方平台</option><option>独立站</option><option>社交电商</option></select></label><label>国家 / 地区<input class="input" id="channel-country" placeholder="例如：美国"></label><label>结算币种<select class="select" id="channel-currency"><option>USD</option><option>EUR</option><option>GBP</option><option>CNY</option></select></label><label>授权 Token<input class="input" id="channel-token" placeholder="输入渠道授权 Token"></label><label class="switch-row"><span><b>启用渠道</b><small>关闭后暂停订单和商品同步。</small></span><span class="switch"><input type="checkbox" id="channel-enabled" checked><i></i></span></label><label class="switch-row"><span><b>订单同步</b><small>按当前频率拉取渠道订单。</small></span><span class="switch"><input type="checkbox" id="sync-orders" checked><i></i></span></label><label class="switch-row"><span><b>商品同步</b><small>同步商品、价格和库存信息。</small></span><span class="switch"><input type="checkbox" id="sync-products" checked><i></i></span></label></div></div><div class="drawer-foot"><button class="btn" id="cancel" type="button">取消</button><button class="btn primary" id="save" type="button">保存连接</button></div></div><script src="assets/icons.js"></script><script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/app.js"></script><script src="assets/shell.js"></script><script>(function(){var channels=DB.CHANNELS.map(function(c,i){return {id:i+1,name:c.name,type:c.type,country:c.country,currency:c.currency,status:c.status,orders:true,products:true,lastSync:'刚刚',token:'已授权'}}),editingId=null;function esc(s){return FMT.esc(String(s))}function openDrawer(c){editingId=c?c.id:null;document.getElementById('drawer-title').textContent=c?'管理渠道连接':'连接新渠道';document.getElementById('channel-name').value=c?c.name:'';document.getElementById('channel-type').value=c?c.type:'第三方平台';document.getElementById('channel-country').value=c?c.country:'';document.getElementById('channel-currency').value=c?c.currency:'USD';document.getElementById('channel-token').value=c?c.token:'';document.getElementById('channel-enabled').checked=c?c.status!=='已暂停':true;document.getElementById('sync-orders').checked=c?c.orders:true;document.getElementById('sync-products').checked=c?c.products:true;document.getElementById('channel-drawer').classList.add('open');document.getElementById('mask').classList.add('open')}function closeDrawer(){document.getElementById('channel-drawer').classList.remove('open');document.getElementById('mask').classList.remove('open');editingId=null}function render(){var q=document.getElementById('channel-search').value.trim().toLowerCase(),filter=document.getElementById('channel-filter').value;var list=channels.filter(function(c){return(!q||(c.name+c.country+c.type).toLowerCase().indexOf(q)>-1)&&(filter==='全部状态'||c.status===filter)});document.getElementById('channels').innerHTML=list.length?list.map(function(c){return '<div class="card"><div class="row between"><span class="panel-glyph">'+icon(c.type==='独立站'?'store':'globe',{size:20})+'</span><span class="badge '+(c.status==='在线'?'success':c.status==='同步中'?'warning':'neutral')+'"><i class="dt"></i>'+esc(c.status)+'</span></div><h3 class="h3 mt-16">'+esc(c.name)+'</h3><p class="muted">'+esc(c.type)+' · '+esc(c.country)+' · '+esc(c.currency)+'</p><hr class="hr"><div class="row between"><small>订单同步</small><b>'+(c.orders?'每 5 分钟':'已暂停')+'</b></div><div class="row between mt-8"><small>商品同步</small><b>'+(c.products?'已开启':'已暂停')+'</b></div><div class="tiny muted mt-8">最近同步：'+esc(c.lastSync)+'</div><div class="row" style="gap:8px"><button class="btn ghost full mt-16" data-manage="'+c.id+'" type="button">管理连接</button><button class="btn ghost sm mt-16" data-sync="'+c.id+'" type="button">同步</button></div></div>';}).join(''):'<div class="empty" style="grid-column:1/-1"><b>暂无匹配渠道</b><span>请调整搜索或筛选条件。</span></div>';document.getElementById('channel-total').textContent=channels.length;document.getElementById('channel-online').textContent=channels.filter(function(c){return c.status==='在线'}).length;document.getElementById('channel-sync').textContent=channels.filter(function(c){return c.status==='同步中'}).length;document.querySelectorAll('[data-manage]').forEach(function(b){b.onclick=function(){openDrawer(channels.find(function(c){return c.id===Number(b.dataset.manage)}))}});document.querySelectorAll('[data-sync]').forEach(function(b){b.onclick=function(){var c=channels.find(function(x){return x.id===Number(b.dataset.sync)});c.status='同步中';c.lastSync='同步中';render();UI.toast(c.name+' 已开始同步')}})}document.getElementById('connect').onclick=function(){openDrawer()};document.getElementById('close').onclick=document.getElementById('cancel').onclick=closeDrawer;document.getElementById('mask').onclick=closeDrawer;document.getElementById('channel-search').oninput=render;document.getElementById('channel-filter').onchange=render;document.getElementById('save').onclick=function(){var name=document.getElementById('channel-name').value.trim(),country=document.getElementById('channel-country').value.trim(),token=document.getElementById('channel-token').value.trim();if(!name||!country||!token){UI.toast('请填写渠道名称、国家和授权 Token','error');return}var c=editingId&&channels.find(function(x){return x.id===editingId});if(c){c.name=name;c.type=document.getElementById('channel-type').value;c.country=country;c.currency=document.getElementById('channel-currency').value;c.token=token;c.status=document.getElementById('channel-enabled').checked?'在线':'已暂停';c.orders=document.getElementById('sync-orders').checked;c.products=document.getElementById('sync-products').checked;UI.toast('渠道配置已更新')}else{channels.push({id:Date.now(),name:name,type:document.getElementById('channel-type').value,country:country,currency:document.getElementById('channel-currency').value,status:'同步中',orders:document.getElementById('sync-orders').checked,products:document.getElementById('sync-products').checked,lastSync:'连接中',token:token});UI.toast('渠道已连接，正在同步')}closeDrawer();render()};render()})();</script></body></html>
