<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店铺管理 · NovaCross</title><link rel="stylesheet" href="assets/styles.css"></head><body data-surface="platform" data-page="platform-shops" data-title="店铺管理" data-crumb="平台治理 / 店铺管理"><aside class="app-nav" id="app-nav"></aside><div class="app-main"><header class="app-topbar" id="app-topbar"></header><main class="app-content"><div class="section-head"><div><div class="eyebrow">MERCHANT ECOSYSTEM</div><h2 class="h1">店铺管理</h2><p class="lead">审核入驻、查看经营健康度并处理店铺治理动作。</p></div><button class="btn primary" id="onboard">审核新店铺</button></div><div class="grid cols-4 mb-24"><div class="kpi"><span class="kpi-label">店铺总数</span><div class="kpi-value">168</div><span class="kpi-delta up">↗ 12 本月新增</span></div><div class="kpi"><span class="kpi-label">正常运营</span><div class="kpi-value">128</div><span class="kpi-delta up">76.2%</span></div><div class="kpi"><span class="kpi-label">待审核</span><div class="kpi-value">7</div><span class="kpi-delta down">需要处理</span></div><div class="kpi"><span class="kpi-label">待整改</span><div class="kpi-value">5</div><span class="kpi-delta down">风险关注</span></div></div><section class="panel"><div class="panel-head"><div class="row"><input class="input" id="q" placeholder="搜索店铺名称 / 编号"><select class="select" id="filter"><option>全部状态</option><option>正常</option><option>待整改</option></select></div><span class="tiny muted">平台店铺目录</span></div><div class="table-wrap"><table class="table"><thead><tr><th>店铺</th><th>类目</th><th>GMV</th><th>订单</th><th>健康度</th><th>状态</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><script src="assets/icons.js"></script><script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/app.js"></script><script src="assets/shell.js"></script><script>API.fetchPlatformShops().then(function(r){var all=r.data;function render(){var q=document.getElementById('q').value.toLowerCase(),f=document.getElementById('filter').value;var list=all.filter(function(s){return(!q||(s.name+s.code).toLowerCase().indexOf(q)>-1)&&(f==='全部状态'||s.status===f);});document.getElementById('rows').innerHTML=list.map(function(s){return '<tr><td><b>'+s.name+'</b><small class="mono">'+s.code+'</small></td><td>'+s.category+'</td><td class="num">'+s.gmv+'</td><td>'+s.orders+'</td><td><div class="row" style="gap:8px"><div class="bar" style="width:90px"><i style="width:'+s.health+'%"></i></div><b>'+s.health+'</b></div></td><td><span class="badge '+(s.status==='正常'?'success':'warning')+'"><i class="dt"></i>'+s.status+'</span></td><td><button class="btn ghost sm" onclick="UI.toast(\'店铺详情已打开\')">查看</button></td></tr>';}).join('');}document.getElementById('q').oninput=render;document.getElementById('filter').onchange=render;render();});document.getElementById('onboard').onclick=function(){UI.toast('店铺入驻审核队列已打开');};</script></body></html>
