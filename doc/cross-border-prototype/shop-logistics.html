<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物流管理 · NovaCross</title><link rel="stylesheet" href="assets/styles.css"></head><body data-surface="shop" data-page="shop-logistics" data-title="物流管理" data-crumb="订单与履约 / 物流管理"><aside class="app-nav" id="app-nav"></aside><div class="app-main"><header class="app-topbar" id="app-topbar"></header><main class="app-content"><div class="section-head"><div><div class="eyebrow">LOGISTICS CONTROL</div><h2 class="h1">物流管理</h2><p class="lead">统一管理承运商、运费模板、发货时效与包裹轨迹。</p></div><div class="row" style="gap:8px"><button class="btn" id="exportBtn" type="button">导出物流报表</button><button class="btn primary" id="newTemplate" type="button">+ 新建运费模板</button></div></div><div class="grid cols-4 mb-24" id="kpis"></div><section class="panel mb-24"><div class="panel-head"><div class="panel-title">物流概览</div><div class="seg" id="tabs"><button class="active" data-tab="all" type="button">全部包裹</button><button data-tab="pending" type="button">待发货</button><button data-tab="transit" type="button">运输中</button><button data-tab="exception" type="button">异常件</button></div></div><div class="panel-body"><div class="row between wrap" style="gap:12px"><label class="search-box" style="max-width:360px"><span>⌕</span><input id="search" type="search" placeholder="搜索订单号 / 运单号 / 国家"></label><select class="select" id="carrierFilter" style="max-width:180px"><option value="all">全部承运商</option><option value="DHL">DHL Express</option><option value="FedEx">FedEx</option><option value="UPS">UPS</option><option value="4PX">4PX</option></select></div><div class="table-wrap mt-16"><table class="table"><thead><tr><th>订单 / 运单号</th><th>目的地</th><th>承运商</th><th>履约节点</th><th>预计送达</th><th>状态</th><th></th></tr></thead><tbody id="shipments"></tbody></table></div></div></section><div class="grid cols-2" style="align-items:start"><section class="panel"><div class="panel-head"><div class="panel-title">承运商服务</div><span class="tiny muted">已接入 4 家</span></div><div class="panel-body" id="carriers"></div></section><section class="panel"><div class="panel-head"><div class="panel-title">运费模板</div><button class="btn ghost sm" id="manageTemplates" type="button">管理模板</button></div><div class="panel-body" id="templates"></div></section></div></main></div><div class="drawer-mask" id="mask"></div><div class="drawer" id="drawer"><div class="drawer-head"><h3 class="h3">新建运费模板</h3><button class="icon-btn" id="close" type="button">×</button></div><div class="drawer-body"><div class="stack"><label>模板名称<input class="input" id="templateName" placeholder="例如：美国标准配送"></label><label>配送区域<select class="select" id="templateRegion"><option>美国 / 加拿大</option><option>欧洲地区</option><option>东南亚地区</option><option>全球其他地区</option></select></label><label>承运商<select class="select" id="templateCarrier"><option>DHL Express</option><option>FedEx</option><option>UPS</option><option>4PX</option></select></label><div class="grid cols-2"><label>首重费用<input class="input" id="firstFee" type="number" min="0" value="12"></label><label>续重费用<input class="input" id="extraFee" type="number" min="0" value="4"></label></div><label>预计时效<input class="input" id="deliveryDays" placeholder="例如：3-5 个工作日"></label><label class="row" style="gap:8px"><input id="freeShipping" type="checkbox"> 满 $80 包邮</label></div></div><div class="drawer-foot"><button class="btn" id="cancel" type="button">取消</button><button class="btn primary" id="save" type="button">保存模板</button></div></div><script src="assets/icons.js"></script><script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/app.js"></script><script src="assets/shell.js"></script><script>
(function(){var shipments=[{order:'NC-20261018-1042',tracking:'DHL77823491',country:'美国 · 加州',carrier:'DHL',step:'已出库',eta:'10 月 22 日',status:'transit'},{order:'NC-20261018-1036',tracking:'FDX92384120',country:'德国 · 柏林',carrier:'FedEx',step:'干线运输',eta:'10 月 24 日',status:'transit'},{order:'NC-20261018-1031',tracking:'待分配',country:'新加坡',carrier:'4PX',step:'待发货',eta:'待确认',status:'pending'},{order:'NC-20261017-0988',tracking:'UPS55190283',country:'加拿大 · 多伦多',carrier:'UPS',step:'地址异常',eta:'暂停派送',status:'exception'}],templates=[{name:'美国标准配送',region:'美国 / 加拿大',carrier:'DHL Express',fee:'首重 $12 · 续重 $4',days:'3-5 个工作日'},{name:'欧洲经济配送',region:'欧洲地区',carrier:'FedEx',fee:'首重 $16 · 续重 $6',days:'5-8 个工作日'},{name:'东南亚包邮',region:'东南亚地区',carrier:'4PX',fee:'满 $80 包邮',days:'7-12 个工作日'}],tab='all';function esc(s){return FMT.esc(String(s))}function statusText(s){return s==='pending'?'待发货':s==='exception'?'异常件':'运输中'}function render(){var q=document.getElementById('search').value.toLowerCase(),carrier=document.getElementById('carrierFilter').value,list=shipments.filter(function(x){return (tab==='all'||x.status===tab)&&(!carrier||carrier==='all'||x.carrier===carrier)&&(!q||[x.order,x.tracking,x.country].join(' ').toLowerCase().indexOf(q)>-1)});document.getElementById('shipments').innerHTML=list.map(function(x){var danger=x.status==='exception';return '<tr><td><b class="mono">'+esc(x.order)+'</b><div class="tiny muted">'+esc(x.tracking)+'</div></td><td>'+esc(x.country)+'</td><td><span class="pill">'+esc(x.carrier)+'</span></td><td>'+esc(x.step)+'</td><td class="tiny muted">'+esc(x.eta)+'</td><td><span class="badge '+(danger?'danger':x.status==='pending'?'warning':'success')+'"><i class="dt"></i>'+statusText(x.status)+'</span></td><td><button class="btn ghost sm" data-track="'+esc(x.tracking)+'" type="button">查看轨迹</button></td></tr>'}).join('')||'<tr><td colspan="7"><div class="empty"><b>暂无匹配包裹</b><span class="tiny">请调整筛选条件</span></div></td></tr>';document.querySelectorAll('[data-track]').forEach(function(b){b.onclick=function(){UI.toast(b.dataset.track==='待分配'?'该包裹尚未生成运单':'已打开 '+b.dataset.track+' 的物流轨迹')}})}function renderTemplates(){document.getElementById('templates').innerHTML=templates.map(function(t,i){return '<div class="row between mb-16" style="gap:12px"><div><b>'+esc(t.name)+'</b><div class="tiny muted mt-8">'+esc(t.region)+' · '+esc(t.carrier)+'</div><div class="tiny muted">'+esc(t.fee)+' · '+esc(t.days)+'</div></div><button class="btn ghost sm" data-template="'+i+'" type="button">编辑</button></div>'}).join('');document.querySelectorAll('[data-template]').forEach(function(b){b.onclick=function(){UI.toast('已打开 '+templates[Number(b.dataset.template)].name)}})}function toggle(v){document.getElementById('drawer').classList.toggle('open',v);document.getElementById('mask').classList.toggle('open',v)}document.getElementById('kpis').innerHTML='<div class="kpi"><span class="kpi-label">今日发货</span><div class="kpi-value">126</div><span class="kpi-delta up">↗ 12.4%</span></div><div class="kpi"><span class="kpi-label">运输中</span><div class="kpi-value">238</div><div class="tiny muted">准时率 96.8%</div></div><div class="kpi"><span class="kpi-label">异常包裹</span><div class="kpi-value">7</div><span class="kpi-delta down">需跟进</span></div><div class="kpi"><span class="kpi-label">平均配送时效</span><div class="kpi-value">4.6 天</div><div class="tiny muted">较上周 -0.8 天</div></div>';document.getElementById('carriers').innerHTML=[['DHL Express','已连接','96.8%','truck'],['FedEx','已连接','95.4%','send'],['UPS','已连接','94.1%','package'],['4PX','同步中','91.7%','globe']].map(function(x){return '<div class="row between mb-16"><div class="row" style="gap:10px">'+icon(x[3],{size:18})+'<div><b>'+x[0]+'</b><div class="tiny muted">妥投及时率 '+x[2]+'</div></div></div><span class="badge '+(x[1]==='已连接'?'success':'warning')+'"><i class="dt"></i>'+x[1]+'</span></div>'}).join('');document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;document.querySelectorAll('#tabs button').forEach(function(x){x.classList.toggle('active',x===b)});render()}});document.getElementById('search').oninput=render;document.getElementById('carrierFilter').onchange=render;document.getElementById('exportBtn').onclick=function(){UI.toast('物流报表 CSV 已生成')};document.getElementById('manageTemplates').onclick=function(){UI.toast('运费模板管理已打开')};document.getElementById('newTemplate').onclick=function(){toggle(true)};document.getElementById('close').onclick=document.getElementById('cancel').onclick=function(){toggle(false)};document.getElementById('mask').onclick=function(){toggle(false)};document.getElementById('save').onclick=function(){var n=document.getElementById('templateName').value.trim(),days=document.getElementById('deliveryDays').value.trim(),first=Number(document.getElementById('firstFee').value),extra=Number(document.getElementById('extraFee').value);if(!n||!days){UI.toast('请填写模板名称和配送时效','error');return}if(first<0||extra<0){UI.toast('费用不能小于 0','error');return}templates.unshift({name:n,region:document.getElementById('templateRegion').value,carrier:document.getElementById('templateCarrier').value,fee:document.getElementById('freeShipping').checked?'满 $80 包邮':'首重 $'+first+' · 续重 $'+extra,days:days});toggle(false);renderTemplates();UI.toast('运费模板已保存')};render();renderTemplates()})();
</script></body></html>
