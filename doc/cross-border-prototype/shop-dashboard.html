<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店铺工作台 · NovaCross</title><link rel="stylesheet" href="assets/styles.css"></head>
<body data-surface="shop" data-page="shop-dashboard" data-title="店铺工作台" data-crumb="店铺总览 / 店铺工作台"><aside class="app-nav" id="app-nav"></aside><div class="app-main"><header class="app-topbar" id="app-topbar"></header><main class="app-content"><div class="row between mb-24"><div><div class="eyebrow">STORE OPERATIONS</div><h2 class="h1">NovaCross 官方旗舰店</h2><p class="lead">把商品、订单和增长动作集中在一个店铺视图里。</p></div><button class="btn primary" id="publishBtn">发布店铺更新</button></div><div class="grid cols-4 stagger mb-24" id="kpis"></div><div class="two-col mb-24"><section class="panel"><div class="panel-head"><div class="panel-title">销售表现</div><span class="badge success">实时同步</span></div><div class="panel-body"><div class="row between mb-16"><div><div class="tiny muted">近 7 日销售额</div><div class="kpi-value">$184,230</div></div><span class="kpi-delta up">↗ 12.4%</span></div><div class="chart-bars" id="shopTrend"></div></div></section><section class="panel"><div class="panel-head"><div class="panel-title">店铺健康度</div><span class="num">96 / 100</span></div><div class="panel-body"><div class="progress-lg"><i style="width:96%"></i></div><div class="grid cols-2 mt-16"><div class="tile"><b>履约及时率</b><strong>98.2%</strong><span class="tiny muted">较上周 +1.4%</span></div><div class="tile"><b>商品合规率</b><strong>99.1%</strong><span class="tiny muted">无待整改项</span></div></div></div></section></div><div class="two-col"><section class="panel"><div class="panel-head"><div class="panel-title">店铺待办</div><span class="badge warning">4</span></div><div class="panel-body panel-body tight" id="todos"></div></section><section class="panel"><div class="panel-head"><div class="panel-title">快捷入口</div></div><div class="panel-body grid cols-2"><a class="tile" href="shop-products.html"><span class="panel-glyph">▣</span><b>管理商品</b><small>上下架、库存和素材</small></a><a class="tile" href="shop-orders.html"><span class="panel-glyph">◫</span><b>处理订单</b><small>发货与售后协同</small></a><a class="tile" href="shop-marketing.html"><span class="panel-glyph">%</span><b>创建活动</b><small>优惠券与促销计划</small></a><a class="tile" href="shop-settlement.html"><span class="panel-glyph">$</span><b>查看结算</b><small>账单与回款状态</small></a></div></section></div></main></div><script src="assets/icons.js"></script><script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/app.js"></script><script src="assets/shell.js"></script><script>(async function(){var d=(await API.fetchShopDashboard()).data;document.getElementById('kpis').innerHTML=d.kpis.map(function(k){return '<div class="kpi"><div class="kpi-top"><span class="kpi-label">'+k.label+'</span><span class="kpi-glyph '+k.tone+'">'+icon(k.glyph,{size:18})+'</span></div><div class="kpi-value">'+k.value+'</div><span class="kpi-delta up">↗ '+k.delta+'</span></div>';}).join('');document.getElementById('shopTrend').innerHTML=[62,74,58,86,92,78,100].map(function(v,i){return '<div class="chart-col '+(i===6?'accent':'')+'"><div class="bar-v" style="--h:'+v+'%"></div><div class="bar-x">'+['10/06','10/07','10/08','10/09','10/10','10/11','10/12'][i]+'</div></div>';}).join('');document.getElementById('todos').innerHTML=d.todos.map(function(t){return '<a class="todo-row" href="shop-products.html"><span class="badge warning"><i class="dt"></i>提醒</span><span>'+t+'</span>'+icon('chevron-right',{size:16})+'</a>';}).join('');document.getElementById('publishBtn').onclick=function(){UI.toast('店铺更新已提交审核');};})();</script></body></html>
