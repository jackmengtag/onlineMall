<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台设置 · NovaCross</title><link rel="stylesheet" href="assets/styles.css"></head><body data-surface="platform" data-page="platform-settings" data-title="平台设置" data-crumb="平台运营 / 平台设置"><aside class="app-nav" id="app-nav"></aside><div class="app-main"><header class="app-topbar" id="app-topbar"></header><main class="app-content"><div class="section-head"><div><div class="eyebrow">PLATFORM SETTINGS</div><h2 class="h1">平台设置</h2><p class="lead">维护跨境交易的基础参数、通知策略与安全策略。</p></div><button class="btn primary" id="save">保存变更</button></div><div class="two-col"><section class="panel"><div class="panel-head"><div class="panel-title">交易基础设置</div></div><div class="panel-body stack"><label class="field"><span>默认结算币种</span><select class="select"><option>USD · 美元</option><option>EUR · 欧元</option><option>CNY · 人民币</option></select></label><label class="field"><span>订单自动取消时间</span><select class="select"><option>30 分钟</option><option>60 分钟</option><option>120 分钟</option></select></label><label class="field"><span>默认税费策略</span><select class="select"><option>按目的国规则计算</option><option>平台统一税率</option></select></label></div></section><section class="panel"><div class="panel-head"><div class="panel-title">安全与通知</div></div><div class="panel-body stack"><label class="switch-row"><span><b>高风险操作二次确认</b><small>改价、退款、权限变更时要求复核</small></span><input type="checkbox" checked></label><label class="switch-row"><span><b>异常登录通知</b><small>通过邮件和站内信通知平台管理员</small></span><input type="checkbox" checked></label><label class="switch-row"><span><b>渠道同步失败告警</b><small>连续失败 3 次后升级为高优先级</small></span><input type="checkbox" checked></label></div></section></div></main></div><script src="assets/icons.js"></script><script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/app.js"></script><script src="assets/shell.js"></script><script>document.getElementById('save').onclick=function(){UI.toast('平台设置已保存');};</script></body></html>
