<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>经营报表 · NovaCross</title><link rel="stylesheet" href="assets/styles.css"></head><body data-surface="shop" data-page="shop-reports" data-title="经营报表" data-crumb="数据与分析 / 经营报表"><aside class="app-nav" id="app-nav"></aside><div class="app-main"><header class="app-topbar" id="app-topbar"></header><main class="app-content"><div class="section-head"><div><div class="eyebrow">BUSINESS INTELLIGENCE</div><h2 class="h1">经营报表</h2><p class="lead">从销售、流量、商品和渠道维度分析店铺经营表现。</p></div><button class="btn primary" id="export" type="button">导出经营报表</button></div><div class="grid cols-4 mb-24" id="kpis"></div><section class="panel mb-24"><div class="panel-head"><div class="panel-title">销售趋势</div><div class="seg" id="range"><button class="active" data-r="7" type="button">近 7 天</button><button data-r="30" type="button">近 30 天</button><button data-r="90" type="button">近 90 天</button></div></div><div class="panel-body"><div id="chart" style="height:180px"></div></div></section><div class="grid cols-2"><section class="panel"><div class="panel-head"><div class="panel-title">商品表现</div><span class="tiny muted">按销售额排序</span></div><div class="panel-body" id="products"></div></section><section class="panel"><div class="panel-head"><div class="panel-title">渠道表现</div><span class="tiny muted">本月 ROI</span></div><div class="panel-body" id="channels"></div></section></div></main></div><script src="assets/icons.js"></script><script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/app.js"></script><script src="assets/shell.js"></script><script>(function(){var data={7:{gmv:'$18,640',orders:'428',conversion:'4.8%',aov:'$43.55',chart:[42,58,48,72,66,84,78]},30:{gmv:'$86,420',orders:'1,982',conversion:'4.6%',aov:'$43.60',chart:[36,44,52,48,68,61,76]},90:{gmv:'$241,860',orders:'5,614',conversion:'4.3%',aov:'$43.08',chart:[28,42,38,56,48,70,82]}};function setRange(key){var x=data[key];document.getElementById('kpis').innerHTML=[['销售额',x.gmv],['订单数',x.orders],['转化率',x.conversion],['客单价',x.aov]].map(function(v){return '<div class="kpi"><span class="kpi-label">'+v[0]+'</span><div class="kpi-value">'+v[1]+'</div></div>'}).join('');document.getElementById('chart').innerHTML='<div style="height:160px;display:flex;align-items:end;gap:12px;border-bottom:1px solid var(--border);padding:0 12px">'+x.chart.map(function(n,i){return '<div title="第 '+(i+1)+' 天 '+n+'%" style="flex:1;height:'+n+'%;background:linear-gradient(180deg,var(--brand-400),var(--brand-700));border-radius:5px 5px 0 0"></div>'}).join('')+'</div>'}document.getElementById('products').innerHTML=[['NovaSound 降噪耳机','$28,420','328 件'],['PulseFit 运动手表','$19,860','214 件'],['AeroPack 旅行背包','$12,640','189 件'],['LumaDesk 台灯','$8,920','156 件']].map(function(x){return '<div class="row between mb-16"><div><b>'+x[0]+'</b><div class="tiny muted">销售量 '+x[2]+'</div></div><b>'+x[1]+'</b></div>'}).join('');document.getElementById('channels').innerHTML=[['独立站','$42,180','ROI 4.8'],['TikTok Shop','$23,640','ROI 3.9'],['Amazon','$14,820','ROI 3.4'],['Google Ads','$5,780','ROI 2.6']].map(function(x){return '<div class="row between mb-16"><div><b>'+x[0]+'</b><div class="tiny muted">销售额 '+x[1]+'</div></div><span class="badge success"><i class="dt"></i>'+x[2]+'</span></div>'}).join('');document.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-r]').forEach(function(x){x.classList.toggle('active',x===b)});setRange(b.dataset.r)}});document.getElementById('export').onclick=function(){UI.toast('经营报表 CSV 已生成')};setRange(7)})();</script></body></html>
