<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>库存中心 · NovaCross 运营中台</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-surface="admin" data-page="inventory" data-title="库存中心" data-crumb="履约 / 库存中心">
  <aside class="app-nav" id="app-nav"></aside>

  <div class="app-main">
    <header class="app-topbar" id="app-topbar"></header>

    <main class="app-content" id="app-content">
      <!-- KPI -->
      <div class="grid cols-4 stagger mb-24" id="kpiRow"></div>

      <!-- 库存明细 -->
      <section class="panel mb-24">
        <div class="panel-head">
          <div class="panel-title"><span class="panel-glyph" data-icon="warehouse"></span>库存明细</div>
          <span class="tiny muted" id="invCount">加载中…</span>
        </div>

        <div class="panel-body">
          <div class="toolbar mb-0">
            <div class="toolbar-left">
              <select class="select" id="whFilter" style="width:auto" aria-label="按仓库筛选"></select>
              <label class="search-box" id="qBox">
                <input type="search" id="qInput" placeholder="搜索 SKU / 商品名" aria-label="搜索 SKU 或商品名">
              </label>
            </div>
            <div class="toolbar-right">
              <label class="row" style="gap:8px;cursor:pointer">
                <span class="switch"><input type="checkbox" id="lowOnly"><i></i></span>
                <span class="tiny muted">仅看低库存</span>
              </label>
            </div>
          </div>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead><tr>
              <th>SKU / 商品</th><th>仓库</th><th class="text-right">在库</th><th class="text-right">已锁定</th>
              <th class="text-right">可用</th><th class="text-right">安全库存</th><th>库存健康度</th><th>操作</th>
            </tr></thead>
            <tbody id="invRows"></tbody>
          </table>
        </div>
      </section>

      <!-- 库存流水 -->
      <section class="panel">
        <div class="panel-head">
          <div class="panel-title"><span class="panel-glyph" data-icon="layers"></span>库存流水</div>
          <span class="tiny muted" id="logCount"></span>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr>
              <th>时间</th><th>SKU</th><th>仓库</th><th>类型</th><th>数量</th><th>关联单号</th><th>操作人</th>
            </tr></thead>
            <tbody id="logRows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- 调整库存模态 -->
  <div class="modal-mask" id="adjMask" onclick="closeAdj()"></div>
  <div class="modal" id="adjModal">
    <div class="modal-head">
      <div class="panel-title"><span class="panel-glyph" data-icon="edit"></span>调整库存</div>
      <button class="icon-btn" type="button" onclick="closeAdj()" title="关闭"></button>
    </div>
    <div class="modal-body">
      <div class="tile mb-16">
        <div class="kv"><span>SKU</span><b class="mono" id="adjSku">—</b></div>
        <div class="kv"><span>仓库</span><b id="adjWh">—</b></div>
      </div>
      <div class="field mb-16">
        <label for="adjType">调整类型</label>
        <select class="select" id="adjType">
          <option value="IN">入库</option>
          <option value="OUT">出库</option>
          <option value="COUNT">盘点调整</option>
        </select>
      </div>
      <div class="field mb-16">
        <label for="adjQty">数量</label>
        <input class="input" id="adjQty" type="number" min="0" step="1" placeholder="请输入数量">
      </div>
      <div class="field">
        <label for="adjNote">备注</label>
        <textarea class="textarea" id="adjNote" placeholder="填写调整原因，如：到货补货 / 盘盈盘亏 / 破损报废"></textarea>
      </div>
      <div class="mt-12" id="adjErr"></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" type="button" onclick="closeAdj()">取消</button>
      <button class="btn primary" type="button" id="adjSubmit" onclick="submitAdj()">提交调整</button>
    </div>
  </div>

  <script src="assets/icons.js"></script>
  <script src="assets/mock.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    (function () {
      var WH = {};
      DB.WAREHOUSES.forEach(function (w) { WH[w.code] = w; });

      var state = { wh: "all", q: "", low: false };
      var ROWS = [];
      var CURR = null; // 当前调整行

      var kpiRow = document.getElementById("kpiRow");
      var invRows = document.getElementById("invRows");
      var logRows = document.getElementById("logRows");
      var invCount = document.getElementById("invCount");
      var logCount = document.getElementById("logCount");

      document.querySelectorAll(".panel-glyph[data-icon]").forEach(function (el) {
        el.innerHTML = icon(el.getAttribute("data-icon"), { size: 16 });
      });
      document.querySelector("#qBox").insertAdjacentHTML("afterbegin", icon("search", { size: 16 }));
      document.querySelector("#adjModal .modal-head .icon-btn").innerHTML = icon("x", { size: 18 });

      /* ---------- helpers ---------- */
      function nowStamp() {
        var d = new Date();
        function p(n) { return (n < 10 ? "0" : "") + n; }
        return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
      }
      function whBadge(code) {
        var w = WH[code];
        if (!w) return '<span class="wh-badge">' + FMT.esc(code) + "</span>";
        return '<span class="wh-badge"><i style="background:' + w.color + '"></i>' + FMT.esc(w.name) + "</span>";
      }
      function skelRows(n, cols) {
        var cell = '<td><div class="skel" style="height:12px"></div></td>';
        var row = "<tr>" + new Array(cols + 1).join(cell) + "</tr>";
        return new Array(n + 1).join(row);
      }
      function kpiCard(label, value, glyph, tone, sub) {
        return '<div class="kpi">' +
          '<div class="kpi-top"><span class="kpi-label">' + label + "</span>" +
            '<span class="kpi-glyph ' + tone + '">' + icon(glyph, { size: 18 }) + "</span></div>" +
          '<div class="kpi-value">' + value + "</div>" +
          (sub ? '<div class="tiny muted">' + sub + "</div>" : "") +
        "</div>";
      }
      function emptyHtml(filtered) {
        var text = filtered ? "没有符合筛选条件的库存行" : "暂无库存数据";
        var sub = filtered ? "试试切换仓库、关闭「仅看低库存」或修改搜索关键词" : "商品入仓后将自动生成库存记录";
        return '<div class="empty"><div class="empty-glyph">' + icon("warehouse", { size: 26 }) + "</div>" +
          "<b>" + text + "</b><span class=\"tiny\">" + sub + "</span></div>";
      }

      /* ---------- KPI ---------- */
      function renderKPISkeleton() {
        kpiRow.innerHTML = [0, 1, 2, 3].map(function () {
          return '<div class="kpi">' +
            '<div class="kpi-top"><div class="skel" style="width:46%"></div><div class="skel" style="width:34px;height:34px;border-radius:10px"></div></div>' +
            '<div class="skel" style="height:26px;width:62%"></div></div>';
        }).join("");
      }
      function renderKPI() {
        var onHand = 0, locked = 0, avail = 0, low = 0;
        ROWS.forEach(function (r) {
          onHand += r.onHand; locked += r.locked; avail += r.available;
          if (r.available < r.safety) low++;
        });
        kpiRow.innerHTML =
          kpiCard("总在库", onHand, "warehouse", "", "全部仓库实物库存合计") +
          kpiCard("已锁定", locked, "clock", "accent", "已被订单锁定，待扣减") +
          kpiCard("可用库存", avail, "box", "info", "可售 / 可分配数量") +
          kpiCard("低库存 SKU", low, "alert-triangle", "gold", "可用低于安全库存的行");
      }

      /* ---------- 明细表 ---------- */
      function filtered() {
        var q = state.q.trim().toLowerCase();
        return ROWS.filter(function (r) {
          if (state.wh !== "all" && r.wh !== state.wh) return false;
          if (state.low && !(r.available < r.safety)) return false;
          if (q && (r.sku + " " + r.name).toLowerCase().indexOf(q) === -1) return false;
          return true;
        });
      }
      function healthBar(r) {
        var pct = r.safety * 2 ? Math.max(0, Math.min(100, Math.round(r.available / (r.safety * 2) * 100))) : 0;
        var danger = r.available < r.safety;
        return '<div class="bar' + (danger ? " danger" : "") + '" title="可用 ' + r.available + " / 安全线 " + r.safety + '"><i style="width:' + pct + '%"></i></div>';
      }
      function rowHtml(r) {
        var low = r.available < r.safety;
        return "<tr>" +
          '<td><div class="cell-2line"><span class="mono cell-strong">' + FMT.esc(r.sku) + "</span><i>" + FMT.esc(r.name) + "</i></div></td>" +
          "<td>" + whBadge(r.wh) + "</td>" +
          '<td class="text-right num">' + r.onHand + "</td>" +
          '<td class="text-right num">' + r.locked + "</td>" +
          '<td class="text-right num"' + (low ? ' style="color:var(--danger)"' : "") + ">" + r.available + "</td>" +
          '<td class="text-right num">' + r.safety + "</td>" +
          '<td style="min-width:120px">' + healthBar(r) + "</td>" +
          '<td><button class="btn sm" type="button" onclick="openAdj(\'' + r.sku + "','" + r.wh + '\')">' + icon("edit", { size: 14 }) + "调整</button></td>" +
        "</tr>";
      }
      function renderInv() {
        var rows = filtered();
        var onFilter = state.wh !== "all" || state.q.trim() || state.low;
        invCount.textContent = "共 " + ROWS.length + " 行 · 当前显示 " + rows.length + " 行";
        invRows.innerHTML = rows.length
          ? rows.map(rowHtml).join("")
          : '<tr><td colspan="8">' + emptyHtml(onFilter) + "</td></tr>";
      }

      /* ---------- 流水表 ---------- */
      function fmtQty(q) {
        var pos = q >= 0;
        return '<span class="badge ' + (pos ? "success" : "danger") + '">' + (pos ? "+" : "") + q + "</span>";
      }
      function renderLog() {
        var logs = DB.INVENTORY_LOG;
        logCount.textContent = "共 " + logs.length + " 条流水";
        logRows.innerHTML = logs.length
          ? logs.map(function (l) {
              return "<tr>" +
                '<td class="tiny muted nowrap">' + l.at + "</td>" +
                '<td class="mono cell-strong">' + FMT.esc(l.sku) + "</td>" +
                "<td>" + whBadge(l.wh) + "</td>" +
                "<td>" + FMT.esc(l.type) + "</td>" +
                "<td>" + fmtQty(l.qty) + "</td>" +
                '<td class="mono">' + FMT.esc(l.ref) + "</td>" +
                "<td>" + FMT.esc(l.by) + "</td>" +
              "</tr>";
            }).join("")
          : '<tr><td colspan="7"><div class="empty"><div class="empty-glyph">' + icon("layers", { size: 26 }) + "</div>" +
            "<b>暂无库存流水</b><span class=\"tiny\">入库 / 出库 / 盘点操作后将在此留痕</span></div></td></tr>";
      }

      /* ---------- 调整模态 ---------- */
      window.openAdj = function (sku, wh) {
        CURR = ROWS.find(function (r) { return r.sku === sku && r.wh === wh; });
        if (!CURR) return;
        document.getElementById("adjSku").textContent = sku;
        var w = WH[wh];
        document.getElementById("adjWh").innerHTML = whBadge(wh);
        document.getElementById("adjType").value = "IN";
        document.getElementById("adjQty").value = "";
        document.getElementById("adjNote").value = "";
        document.getElementById("adjErr").innerHTML = "";
        document.getElementById("adjMask").classList.add("open");
        UI.openModal("adjModal");
      };
      window.closeAdj = function () {
        document.getElementById("adjMask").classList.remove("open");
        UI.closeModal("adjModal");
      };
      function errBadge(msg) {
        return '<span class="badge danger">' + icon("alert-triangle", { size: 13 }) + msg + "</span>";
      }
      window.submitAdj = function () {
        var type = document.getElementById("adjType").value;
        var raw = document.getElementById("adjQty").value;
        var qty = parseFloat(raw);
        var err = document.getElementById("adjErr");
        err.innerHTML = "";
        if (raw === "" || isNaN(qty) || qty <= 0) {
          err.innerHTML = errBadge("数量必须为大于 0 的数字");
          UI.toast("请输入大于 0 的数量", "error");
          return;
        }
        if (type === "COUNT" && Math.floor(qty) !== qty) {
          err.innerHTML = errBadge("盘点调整数量必须为整数");
          UI.toast("盘点调整数量必须为整数", "error");
          return;
        }
        var btn = document.getElementById("adjSubmit");
        btn.classList.add("disabled");
        btn.textContent = "提交中…";
        setTimeout(function () {
          applyAdjust(type, qty);
          btn.classList.remove("disabled");
          btn.innerHTML = "提交调整";
          closeAdj();
        }, 460);
      };
      function applyAdjust(type, qty) {
        var row = CURR;
        var note = document.getElementById("adjNote").value.trim();
        if (type === "IN") row.onHand += qty;
        else if (type === "OUT") row.onHand -= qty;
        else row.onHand = qty;
        row.available = row.onHand - row.locked;

        var typeLabel = type === "IN" ? "入库" : type === "OUT" ? "出库" : "盘点调整";
        var signedQty = type === "IN" ? qty : (type === "OUT" ? -qty : qty);
        DB.INVENTORY_LOG.unshift({
          at: nowStamp(),
          sku: row.sku,
          wh: row.wh,
          type: typeLabel,
          qty: signedQty,
          ref: "MANUAL-" + Date.now(),
          by: "杨琳"
        });

        renderKPI();
        renderInv();
        renderLog();
        UI.toast("库存已调整：SKU " + row.sku + " 仓库 " + (WH[row.wh] ? WH[row.wh].name : row.wh));
      }

      /* ---------- 筛选交互 ---------- */
      document.getElementById("whFilter").innerHTML = '<option value="all">全部仓库</option>' +
        DB.WAREHOUSES.map(function (w) { return '<option value="' + w.code + '">' + FMT.esc(w.name) + "</option>"; }).join("");
      document.getElementById("whFilter").addEventListener("change", function () {
        state.wh = this.value; renderInv();
      });
      document.getElementById("qInput").addEventListener("input", function () {
        state.q = this.value; renderInv();
      });
      document.getElementById("lowOnly").addEventListener("change", function () {
        state.low = this.checked; renderInv();
      });

      /* ---------- 启动 ---------- */
      (async function () {
        renderKPISkeleton();
        invRows.innerHTML = skelRows(6, 8);
        logRows.innerHTML = skelRows(5, 7);
        var res = await API.fetchInventory();
        ROWS = res.data;
        renderKPI();
        renderInv();
        renderLog();
      })();
    })();
  </script>
</body>
</html>
