<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台驾驶舱 · NovaCross</title><link rel="stylesheet" href="assets/styles.css"></head><body data-surface="platform" data-page="platform-dashboard" data-title="平台驾驶舱" data-crumb="平台总览 / 平台驾驶舱"><aside class="app-nav" id="app-nav"></aside><div class="app-main"><header class="app-topbar" id="app-topbar"></header><main class="app-content"><div class="row between mb-24"><div><div class="eyebrow">PLATFORM CONTROL TOWER</div><h2 class="h1">平台驾驶舱</h2><p class="lead">从平台视角管理店铺生态、交易规模与风险信号。</p></div><span class="badge success"><i class="dt"></i>系统运行正常</span></div><div class="grid cols-4 stagger mb-24" id="kpis"></div><div class="two-col mb-24"><section class="panel"><div class="panel-head"><div class="panel-title">平台交易趋势</div><div class="seg" id="range-tabs"><button class="active" data-range="7" type="button">近 7 日</button><button data-range="30" type="button">近 30 日</button><button data-range="90" type="button">近 90 日</button></div></div><div class="panel-body"><div class="chart-bars" id="trend"></div></div></section><section class="panel"><div class="panel-head"><div class="panel-title">风险与治理</div><span class="badge warning" id="audit-count"></span></div><div class="panel-body" id="audits"></div></section></div><section class="panel"><div class="panel-head"><div class="panel-title">重点店铺</div><a class="btn ghost sm" href="platform-shops.html">管理全部</a></div><div class="table-wrap"><table class="table"><thead><tr><th>店铺</th><th>经营类目</th><th>GMV</th><th>订单</th><th>健康度</th><th>状态</th><th></th></tr></thead><tbody id="shops"></tbody></table></div></section></main></div><div class="drawer-mask" id="mask"></div><div class="drawer" id="detail-drawer"><div class="drawer-head"><h3 class="h3" id="drawer-title">详情</h3><button class="icon-btn" id="close-drawer" type="button">×</button></div><div class="drawer-body" id="drawer-body"></div><div class="drawer-foot"><button class="btn" id="drawer-cancel" type="button">关闭</button><button class="btn primary" id="drawer-action" type="button">确认</button></div></div><script src="assets/icons.js"></script><script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/app.js"></script><script src="assets/shell.js"></script><script>(async function(){var d=(await API.fetchPlatformDashboard()).data,rangeData={7:{values:[55,68,72,64,82,91,100],labels:['10/06','10/07','10/08','10/09','10/10','10/11','10/12']},30:{values:[42,55,48,70,62,78,90],labels:['第 1 周','第 2 周','第 3 周','第 4 周','本周']},90:{values:[35,46,58,52,68,74,92],labels:['7 月','8 月','9 月','10 月']}};var audits=d.audits.map(function(a){return Object.assign({},a,{handled:false})});function esc(s){return FMT.esc(String(s))}function openDetail(title,body,action,handler){document.getElementById('drawer-title').textContent=title;document.getElementById('drawer-body').innerHTML=body;document.getElementById('drawer-action').textContent=action||'确认';document.getElementById('drawer-action').onclick=handler||closeDrawer;document.getElementById('detail-drawer').classList.add('open');document.getElementById('mask').classList.add('open')}function closeDrawer(){document.getElementById('detail-drawer').classList.remove('open');document.getElementById('mask').classList.remove('open')}function renderKpis(){document.getElementById('kpis').innerHTML=d.kpis.map(function(k){return '<button class="kpi" data-kpi="'+esc(k.label)+'" type="button"><div class="kpi-top"><span class="kpi-label">'+esc(k.label)+'</span><span class="kpi-glyph '+esc(k.tone)+'">'+icon(k.glyph,{size:18})+'</span></div><div class="kpi-value">'+esc(k.value)+'</div><span class="kpi-delta up">↗ '+esc(k.delta)+'</span></button>';}).join('');document.querySelectorAll('[data-kpi]').forEach(function(b){b.onclick=function(){openDetail(b.dataset.kpi,'<p class="lead">该指标当前数据已同步，可前往相关业务模块查看明细和趋势。</p>','前往明细',function(){window.location.href=b.dataset.kpi.indexOf('店铺')>-1?'platform-shops.html':b.dataset.kpi.indexOf('风险')>-1?'platform-audit.html':'platform-shops.html'})}})}function renderTrend(key){var x=rangeData[key];document.getElementById('trend').innerHTML=x.values.map(function(v,i){return '<div class="chart-col '+(i===x.values.length-1?'accent':'')+'"><div class="bar-v" style="--h:'+v+'%" title="'+x.labels[i]+' · '+v+'%"></div><div class="bar-x">'+x.labels[i]+'</div></div>';}).join('')}function renderAudits(){var pending=audits.filter(function(a){return !a.handled});document.getElementById('audit-count').textContent=pending.length+' 条待处理';document.getElementById('audits').innerHTML=audits.length?audits.map(function(a,i){return '<button class="todo-row" data-audit="'+i+'" type="button" style="width:100%;text-align:left;'+(a.handled?'opacity:.55':'')+'"><span class="badge '+(a.level==='高风险'?'danger':a.level==='需复核'?'warning':'success')+'"><i class="dt"></i>'+esc(a.level)+'</span><span><b>'+esc(a.event)+'</b><small>'+esc(a.target)+' · '+esc(a.actor)+'</small></span><span class="mono">'+esc(a.handled?'已处理':a.time)+'</span></button>'}).join(''):'<div class="empty">暂无风险事件</div>';document.querySelectorAll('[data-audit]').forEach(function(b){b.onclick=function(){var i=Number(b.dataset.audit),a=audits[i];openDetail('风险事件详情','<p><b>'+esc(a.event)+'</b></p><p class="muted">目标：'+esc(a.target)+'<br>操作者：'+esc(a.actor)+'<br>发生时间：'+esc(a.time)+'</p>',a.handled?'关闭':'标记已处理',function(){a.handled=true;renderAudits();closeDrawer();UI.toast('风险事件已标记为已处理')})}})}function renderShops(){document.getElementById('shops').innerHTML=d.shops.map(function(s){return '<tr><td><b>'+esc(s.name)+'</b><small class="mono">'+esc(s.code)+'</small></td><td>'+esc(s.category)+'</td><td class="num">'+esc(s.gmv)+'</td><td>'+esc(s.orders)+'</td><td><div class="row" style="gap:8px"><div class="bar" style="width:90px"><i style="width:'+Number(s.health)+'%"></i></div><b>'+esc(s.health)+'</b></div></td><td><span class="badge '+(s.status==='正常'?'success':'warning')+'"><i class="dt"></i>'+esc(s.status)+'</span></td><td><button class="btn ghost sm" data-shop="'+esc(s.code)+'" type="button">查看</button></td></tr>';}).join('');document.querySelectorAll('[data-shop]').forEach(function(b){b.onclick=function(){var s=d.shops.find(function(x){return x.code===b.dataset.shop});openDetail('店铺详情','<p><b>'+esc(s.name)+'</b></p><p class="muted">店铺编号：'+esc(s.code)+'<br>经营类目：'+esc(s.category)+'<br>GMV：'+esc(s.gmv)+'<br>订单数：'+esc(s.orders)+'<br>健康度：'+esc(s.health)+'<br>状态：'+esc(s.status)+'</p>','进入店铺管理',function(){window.location.href='platform-shops.html'})}})}document.querySelectorAll('#range-tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('#range-tabs button').forEach(function(x){x.classList.toggle('active',x===b)});renderTrend(b.dataset.range)}});document.getElementById('close-drawer').onclick=document.getElementById('drawer-cancel').onclick=closeDrawer;document.getElementById('mask').onclick=closeDrawer;renderKpis();renderTrend('7');renderAudits();renderShops()})();</script></body></html>
