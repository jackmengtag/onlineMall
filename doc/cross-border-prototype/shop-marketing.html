<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>营销活动 · NovaCross</title><link rel="stylesheet" href="assets/styles.css"></head><body data-surface="shop" data-page="shop-marketing" data-title="营销活动" data-crumb="经营管理 / 营销活动"><aside class="app-nav" id="app-nav"></aside><div class="app-main"><header class="app-topbar" id="app-topbar"></header><main class="app-content"><div class="section-head"><div><div class="eyebrow">GROWTH STUDIO</div><h2 class="h1">营销活动</h2><p class="lead">围绕黑五、新客和区域市场搭建可追踪的增长动作。</p></div><button class="btn primary" id="newCampaign">+ 创建活动</button></div><div class="grid cols-3 mb-24"><div class="kpi"><span class="kpi-label">活动带来销售额</span><div class="kpi-value">$48,620</div><span class="kpi-delta up">↗ 21.8%</span></div><div class="kpi"><span class="kpi-label">活动转化率</span><div class="kpi-value">4.8%</div><span class="kpi-delta up">↗ 0.6%</span></div><div class="kpi"><span class="kpi-label">优惠券核销</span><div class="kpi-value">2,184</div><span class="kpi-delta up">↗ 14.2%</span></div></div><section class="panel"><div class="panel-head"><div class="panel-title">活动计划</div><div class="row" style="gap:8px"><select class="select" id="campaignFilter" style="width:130px;height:34px"><option value="全部">全部状态</option><option value="进行中">进行中</option><option value="草稿">草稿</option><option value="已结束">已结束</option></select><span class="tiny muted" id="campaignCount">按最近更新时间排序</span></div></div><div class="panel-body" id="campaigns"></div></section><div class="drawer-mask" id="campaignMask"></div><div class="drawer" id="campaignDrawer"><div class="drawer-head"><h3 class="h3">创建营销活动</h3><button class="icon-btn" id="closeCampaign" type="button">×</button></div><div class="drawer-body"><div class="stack"><label>活动名称<input class="input" id="campaignName" placeholder="例如：双11会员专享日"></label><label>活动类型<select class="select" id="campaignType"><option>优惠券</option><option>满减 / 满折</option><option>限时秒杀</option><option>会员价</option><option>平台活动报名</option><option>内容推广</option></select></label><label>活动商品<select class="select" id="campaignProduct"><option value="all">全店商品</option></select></label><div class="field"><span>活动 SKU</span><div class="row wrap" id="campaignSkuPicker" style="gap:6px"><span class="tiny muted">选择指定商品后配置 SKU</span></div><div class="tiny muted" id="campaignSkuHint">全店活动无需指定 SKU</div></div><div class="grid cols-2"><label>开始日期<input class="input" id="campaignStart" type="date" value="2026-11-01"></label><label>结束日期<input class="input" id="campaignEnd" type="date" value="2026-11-11"></label></div><label>优惠规则<input class="input" id="campaignRule" placeholder="例如：满 $80 减 $15 / 全场 9 折"></label><div class="grid cols-2"><label>预算<input class="input" id="campaignBudget" type="number" min="0" placeholder="12000"></label><label>目标转化率<input class="input" id="campaignTarget" type="number" min="0" max="100" step="0.1" placeholder="4.8"></label></div></div></div><div class="drawer-foot"><button class="btn" id="cancelCampaign" type="button">取消</button><button class="btn primary" id="saveCampaign" type="button">保存草稿</button></div></div></main></div><script src="assets/icons.js"></script><script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/app.js"></script><script src="assets/shell.js"></script><script>var campaigns=DB.EXTENSIONS.SHOP.campaigns.slice(),filter=document.getElementById('campaignFilter'),mask=document.getElementById('campaignMask'),drawer=document.getElementById('campaignDrawer'),selectedSku='';function esc(s){return FMT.esc(String(s))}function variants(p){var sizes=p.sizes&&p.sizes.length?p.sizes:['标准'],total=Math.max(1,p.colors.length*sizes.length),out=[];p.colors.forEach(function(color,c){sizes.forEach(function(size,s){var index=c*sizes.length+s,stock=Object.keys(p.stock||{}).reduce(function(n,w){var amount=p.stock[w]||0;return n+Math.floor(amount/total)+(index<amount%total?1:0)},0);out.push({sku:index===0?p.sku:p.spu.replace('SPU-','SKU-')+'-C'+(c+1)+'-S'+(s+1),label:color+(p.sizes&&p.sizes.length?' / '+size:''),stock:stock})})});return out}function renderSkuPicker(){var product=document.getElementById('campaignProduct').value,box=document.getElementById('campaignSkuPicker'),hint=document.getElementById('campaignSkuHint');selectedSku='';if(product==='all'){box.innerHTML='<span class="tiny muted">选择指定商品后配置 SKU</span>';hint.textContent='全店活动无需指定 SKU';return}var p=DB.PRODUCTS.find(function(x){return x.id===product});box.innerHTML=variants(p).map(function(v){return '<button type="button" class="btn sm '+(v.stock?'':'disabled')+'" data-sku="'+esc(v.sku)+'" '+(v.stock?'':'disabled')+'>'+esc(v.label)+' · '+v.stock+' 件</button>'}).join('');hint.textContent='请选择一个有库存 SKU';box.querySelectorAll('[data-sku]').forEach(function(b){b.onclick=function(){selectedSku=b.dataset.sku;box.querySelectorAll('[data-sku]').forEach(function(x){x.classList.remove('primary')});b.classList.add('primary');hint.textContent='已选择 '+b.textContent}})}function renderCampaigns(){var status=filter.value,list=campaigns.filter(function(c){return status==='全部'||c.status===status});document.getElementById('campaignCount').textContent='共 '+list.length+' 个活动';document.getElementById('campaigns').innerHTML=list.length?list.map(function(c){return '<div class="card mb-16"><div class="row between wrap"><div><span class="badge '+(c.status==='进行中'?'success':c.status==='草稿'?'warning':'neutral')+'">'+esc(c.status)+'</span><h3 class="h3 mt-8">'+esc(c.name)+'</h3><div class="tiny muted">'+esc(c.type||'店铺营销')+' · '+esc(c.date||'待配置时间')+(c.sku?' · '+esc(c.sku):'')+'</div></div><button class="btn ghost sm" data-detail="'+campaigns.indexOf(c)+'" type="button">查看详情</button></div><div class="grid cols-3 mt-16"><div><small>触达人数</small><b>'+esc(c.reach||'0')+'</b></div><div><small>转化率</small><b>'+esc(c.conversion||'待统计')+'</b></div><div><small>预算消耗</small><b>'+esc(c.budget||'$0')+'</b></div></div></div>'}).join(''):'<div class="empty"><b>暂无匹配活动</b><span class="tiny">请切换状态或创建新的营销活动</span></div>';document.querySelectorAll('[data-detail]').forEach(function(b){b.onclick=function(){var c=campaigns[Number(b.dataset.detail)];UI.toast(c.name+' · 活动详情已打开')}})}function toggle(open){drawer.classList.toggle('open',open);mask.classList.toggle('open',open)}filter.onchange=renderCampaigns;document.getElementById('campaignProduct').innerHTML='<option value="all">全店商品</option>'+DB.PRODUCTS.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('');document.getElementById('campaignProduct').onchange=renderSkuPicker;document.getElementById('newCampaign').onclick=function(){renderSkuPicker();toggle(true)};document.getElementById('closeCampaign').onclick=document.getElementById('cancelCampaign').onclick=function(){toggle(false)};mask.onclick=function(){toggle(false)};document.getElementById('saveCampaign').onclick=function(){var name=document.getElementById('campaignName').value.trim(),rule=document.getElementById('campaignRule').value.trim(),product=document.getElementById('campaignProduct').value,start=document.getElementById('campaignStart').value,end=document.getElementById('campaignEnd').value,budget=Number(document.getElementById('campaignBudget').value||0),target=Number(document.getElementById('campaignTarget').value||0);if(!name||!rule){UI.toast('请填写活动名称和优惠规则','error');return}if(product!=='all'&&!selectedSku){UI.toast('请选择有库存的活动 SKU','error');return}if(!start||!end||end<start){UI.toast('请检查活动起止日期','error');return}if(budget<0||target<0||target>100){UI.toast('预算或目标转化率不合法','error');return}campaigns.unshift({name:name,status:'草稿',type:document.getElementById('campaignType').value,date:start+' 至 '+end,reach:'0',conversion:target?target.toFixed(1)+'%':'待统计',budget:'$'+budget.toLocaleString(),rule:rule,sku:selectedSku});toggle(false);renderCampaigns();UI.toast('营销活动已保存为草稿')};renderSkuPicker();renderCampaigns();</script></body></html>
