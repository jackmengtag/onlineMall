<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>账户中心 · NovaCross 诺瓦跨境优选</title><link rel="stylesheet" href="assets/styles.css"></head><body data-surface="storefront" data-page="account"><header class="site-header" id="site-header"></header><main class="site-main"><div class="container section"><div class="section-head"><div><div class="eyebrow">MY ACCOUNT</div><h1 class="h1 mt-8">账户中心</h1><p class="lead">管理个人信息、收货地址和订单入口。</p></div><button class="btn ghost" id="logout" type="button">退出登录</button></div><div class="grid cols-3"><section class="panel"><div class="panel-head"><div class="panel-title">个人信息</div></div><div class="panel-body"><form id="profile-form" class="stack"><label class="field"><span>显示名称</span><input class="input" id="profile-name"></label><label class="field"><span>邮箱</span><input class="input" id="profile-email" type="email" disabled></label><label class="field"><span>联系电话</span><input class="input" id="profile-phone" placeholder="如 +1 310-555-0132"></label><button class="btn primary" type="submit">保存信息</button></form></div></section><section class="panel"><div class="panel-head"><div class="panel-title">账户快捷入口</div></div><div class="panel-body stack"><a class="btn ghost" href="orders.html">查看我的订单</a><a class="btn ghost" href="index.html#catalog">继续选购商品</a><button class="btn ghost" id="currency" type="button">当前币种：USD</button></div></section><section class="panel"><div class="panel-head"><div class="panel-title">收货地址</div><button class="btn ghost sm" id="add-address" type="button">新增地址</button></div><div class="panel-body" id="addresses"></div></section></div></div></main><footer class="site-footer" id="site-footer"></footer><div class="modal" id="address-modal"><div class="modal-card"><div class="modal-head"><h3 class="h3">新增收货地址</h3><button class="icon-btn" id="close-address" type="button">×</button></div><form id="address-form" class="modal-body stack"><label class="field"><span>收件人</span><input class="input" id="address-name"></label><label class="field"><span>国家 / 地区</span><select class="select" id="address-country"><option value="US">美国</option><option value="DE">德国</option><option value="SG">新加坡</option><option value="IT">意大利</option></select></label><label class="field"><span>邮编</span><input class="input" id="address-zip"></label><label class="field"><span>详细地址</span><input class="input" id="address-line"></label><div class="modal-foot"><button class="btn" id="cancel-address" type="button">取消</button><button class="btn primary" type="submit">保存地址</button></div></form></div></div><script src="assets/icons.js"></script><script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/app.js"></script><script src="assets/shell.js"></script><script>(function(){function session(){try{return JSON.parse(localStorage.getItem('nc_session')||'null')}catch(e){return null}}function goLogin(){location.href='login.html?redirect=account.html'}var s=session();if(!s){goLogin();return}var users=JSON.parse(localStorage.getItem('nc_users')||'[]'),user=users.find(function(x){return x.id===s.userId})||users.find(function(x){return x.email===s.email});if(!user){goLogin();return}var name=document.getElementById('profile-name'),email=document.getElementById('profile-email'),phone=document.getElementById('profile-phone'),list=document.getElementById('addresses');name.value=user.name||'';email.value=user.email;phone.value=user.phone||'';function save(){localStorage.setItem('nc_users',JSON.stringify(users))}function render(){list.innerHTML=(user.addresses||[]).length?user.addresses.map(function(a,i){return '<div class="address-row mb-16"><b>'+FMT.esc(a.name)+'</b><div class="tiny muted mt-8">'+FMT.esc(a.country)+' · '+FMT.esc(a.zip)+'<br>'+FMT.esc(a.line)+'</div><button class="btn ghost sm mt-8" data-del="'+i+'" type="button">删除</button></div>'}).join(''):'<div class="empty"><span class="tiny">暂未保存收货地址</span></div>';document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){user.addresses.splice(Number(b.dataset.del),1);save();render();UI.toast('地址已删除')}})}document.getElementById('profile-form').onsubmit=function(e){e.preventDefault();user.name=name.value.trim()||user.name;user.phone=phone.value.trim();save();var next=JSON.parse(localStorage.getItem('nc_session')||'{}');next.name=user.name;localStorage.setItem('nc_session',JSON.stringify(next));UI.toast('个人信息已保存')};document.getElementById('logout').onclick=function(){localStorage.removeItem('nc_session');location.href='login.html'};var modal=document.getElementById('address-modal');function close(){modal.classList.remove('open')}document.getElementById('add-address').onclick=function(){modal.classList.add('open')};document.getElementById('close-address').onclick=document.getElementById('cancel-address').onclick=close;document.getElementById('address-form').onsubmit=function(e){e.preventDefault();var a={name:document.getElementById('address-name').value.trim(),country:document.getElementById('address-country').value,zip:document.getElementById('address-zip').value.trim(),line:document.getElementById('address-line').value.trim()};if(!a.name||!a.zip||!a.line){UI.toast('请填写完整地址信息','error');return}user.addresses=user.addresses||[];user.addresses.push(a);save();render();close();e.target.reset();UI.toast('收货地址已保存')};document.getElementById('currency').onclick=function(){var order=['USD','EUR','CNY'],cur=FMT.currency(),next=order[(order.indexOf(cur)+1)%order.length];FMT.setCurrency(next);this.textContent='当前币种：'+next;UI.toast('已切换结算币种：'+next,'info')};document.getElementById('currency').textContent='当前币种：'+FMT.currency();render()})();</script></body></html>
