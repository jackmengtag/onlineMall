<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店铺管理 · NovaCross</title><link rel="stylesheet" href="assets/styles.css"></head><body data-surface="shop" data-page="shop-management" data-title="店铺管理" data-crumb="店铺设置 / 店铺管理"><aside class="app-nav" id="app-nav"></aside><div class="app-main"><header class="app-topbar" id="app-topbar"></header><main class="app-content"><div class="section-head"><div><div class="eyebrow">STORE CONTROL CENTER</div><h2 class="h1">店铺管理</h2><p class="lead">围绕货、单、客、数、财统一管理店铺经营基础设施。</p></div><button class="btn primary" id="saveAll" type="button">保存店铺设置</button></div><div class="grid cols-4 mb-24" id="kpis"></div><div class="grid cols-2" style="align-items:start"><section class="panel"><div class="panel-head"><div class="panel-title">店铺基础信息</div><span class="tiny muted">对外展示信息</span></div><div class="panel-body"><div class="stack"><label>店铺名称<input class="input" id="storeName" value="NovaCross Global Store"></label><label>店铺简介<textarea class="textarea" id="storeDesc">面向美国、欧洲与东南亚市场的跨境直营店铺，提供海外仓快速履约。</textarea></label><div class="grid cols-2"><label>店铺语言<select class="select"><option>简体中文</option><option>English</option></select></label><label>默认币种<select class="select"><option>USD · 美元</option><option>EUR · 欧元</option><option>CNY · 人民币</option></select></label></div><label>品牌主色<input class="input" id="brandColor" type="color" value="#1f7a5a"></label></div></div></section><section class="panel"><div class="panel-head"><div class="panel-title">经营健康度</div><span class="badge success"><i class="dt"></i>运行正常</span></div><div class="panel-body" id="health"></div></section></div><section class="panel mt-24"><div class="panel-head"><div class="panel-title">店铺功能模块</div><span class="tiny muted">按运营职责快速进入</span></div><div class="panel-body"><div class="grid cols-4" id="modules"></div></div></section><section class="panel mt-24"><div class="panel-head"><div class="panel-title">经营指标趋势</div><div class="row" style="gap:8px"><button class="btn sm primary" data-range="7">近 7 天</button><button class="btn sm" data-range="30">近 30 天</button><button class="btn sm" data-range="90">近 90 天</button></div></div><div class="panel-body"><div class="grid cols-4" id="trendKpis"></div><div id="trendChart" style="height:170px;margin-top:18px"></div></div></section><section class="panel mt-24"><div class="panel-head"><div><div class="panel-title">营销模块</div><span class="tiny muted">活动、优惠与推广计划的统一入口</span></div><button class="btn primary sm" id="createMarketing" type="button">+ 新建营销计划</button></div><div class="panel-body"><div class="grid cols-3" id="marketingModules"></div><div class="panel mt-16"><div class="panel-head"><div class="panel-title">营销计划</div><span class="tiny muted" id="marketingCount"></span></div><div class="panel-body" id="marketingPlans"></div></div></div></section><section class="panel mt-24"><div class="panel-head"><div class="panel-title">快捷设置</div><span class="tiny muted">店铺日常配置入口</span></div><div class="panel-body"><div class="row wrap" style="gap:8px" id="quick"></div></div></section></main></div><script src="assets/icons.js"></script><script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/app.js"></script><script src="assets/shell.js"></script><script>
(function(){var modules=[['商品与库存','管理商品、SKU、价格与安全库存','shop-products.html','box'],['订单与履约','审单、发货、物流与售后','shop-orders.html','receipt'],['营销与推广','优惠券、满减、秒杀与活动报名','shop-marketing.html','percent'],['数据与报表','销售、流量、转化与经营诊断','shop-dashboard.html','bar-chart'],['客户与评价','客服、快捷回复、评价与会员','shop-orders.html','message-circle'],['财务与结算','平台账单、对账与提现','shop-settlement.html','wallet'],['店铺装修','首页、导航、分类与内容组件','shop-dashboard.html','layout'],['账号与权限','子账号、角色权限与操作日志','shop-dashboard.html','users']],ranges={7:{gmv:'$18,640',orders:'428',conversion:'4.8%',客单:'$43.55',chart:[42,58,48,72,66,84,78]},30:{gmv:'$86,420',orders:'1,982',conversion:'4.6%',客单:'$43.60',chart:[36,44,52,48,68,61,76]},90:{gmv:'$241,860',orders:'5,614',conversion:'4.3%',客单:'$43.08',chart:[28,42,38,56,48,70,82]}},plans=[{name:'黑五提前购 · 官方立减',type:'直降折扣',status:'进行中',rule:'全店 85 折',used:'1,842',sales:'$48,620'},{name:'新客首单礼',type:'优惠券',status:'进行中',rule:'满 $80 减 $15',used:'928',sales:'$23,640'},{name:'秋季会员日',type:'会员价',status:'草稿',rule:'会员额外 9 折',used:'0',sales:'$0'}],trend=ranges[7];function setTrend(range){trend=ranges[range];document.getElementById('trendKpis').innerHTML=[['销售额',trend.gmv],['订单数',trend.orders],['转化率',trend.conversion],['客单价',trend.客单]].map(function(x){return '<div><small>'+x[0]+'</small><b class="h3">'+x[1]+'</b></div>'}).join('');document.getElementById('trendChart').innerHTML='<div style="height:150px;display:flex;align-items:end;gap:12px;padding:0 12px;border-bottom:1px solid var(--border)">'+trend.chart.map(function(x,i){return '<div title="第 '+(i+1)+' 天 '+x+'%" style="flex:1;height:'+x+'%;background:linear-gradient(180deg,var(--brand-400),var(--brand-700));border-radius:5px 5px 0 0;min-width:12px"></div>'}).join('')+'</div>'}document.getElementById('kpis').innerHTML='<div class="kpi"><span class="kpi-label">店铺商品</span><div class="kpi-value">248</div><div class="tiny muted">12 个 SKU 低库存</div></div><div class="kpi"><span class="kpi-label">待处理订单</span><div class="kpi-value">36</div><span class="kpi-delta down">↘ 8.4%</span></div><div class="kpi"><span class="kpi-label">本月销售额</span><div class="kpi-value">$86,420</div><span class="kpi-delta up">↗ 18.6%</span></div><div class="kpi"><span class="kpi-label">店铺评分</span><div class="kpi-value">4.8</div><div class="tiny muted">服务响应 98.6%</div></div>';document.getElementById('health').innerHTML=[['商品信息完整度','96%','success'],['库存同步状态','正常 · 2 分钟前','success'],['订单履约及时率','94.2%','warning'],['客服响应率','98.6%','success'],['结算对账状态','无异常','success']].map(function(x){return '<div class="row between mb-16"><span>'+x[0]+'</span><b class="'+x[2]+'-text">'+x[1]+'</b></div>'}).join('');document.getElementById('modules').innerHTML=modules.map(function(x){return '<a class="card" href="'+x[2]+'" style="text-decoration:none"><div class="row" style="gap:10px">'+icon(x[3],{size:20})+'<b>'+x[0]+'</b></div><p class="tiny muted mt-8">'+x[1]+'</p><span class="tiny brand-text">进入管理 →</span></a>'}).join('');document.getElementById('marketingModules').innerHTML=[['优惠券中心','创建店铺券、品类券与新客券','shop-marketing.html'],['满减与秒杀','设置满减、满折与限时库存','shop-marketing.html'],['平台活动报名','报名 618、黑五等平台大促','shop-marketing.html'],['推广计划','管理渠道预算与投放 ROI','shop-marketing.html'],['会员营销','会员价、积分与复购触达','shop-marketing.html'],['内容种草','直播、短视频与达人合作','shop-marketing.html']].map(function(x){return '<a class="card" href="'+x[2]+'" style="text-decoration:none"><b>'+x[0]+'</b><p class="tiny muted mt-8">'+x[1]+'</p><span class="tiny brand-text">配置模块 →</span></a>'}).join('');function renderPlans(){document.getElementById('marketingCount').textContent='共 '+plans.length+' 个计划';document.getElementById('marketingPlans').innerHTML=plans.map(function(p,i){return '<div class="row between wrap mb-16" style="gap:10px"><div><span class="badge '+(p.status==='进行中'?'success':'warning')+'"><i class="dt"></i>'+p.status+'</span><b class="ml-8">'+p.name+'</b><div class="tiny muted mt-8">'+p.type+' · '+p.rule+' · 已使用 '+p.used+'</div></div><div class="row" style="gap:8px"><b>'+p.sales+'</b><button class="btn ghost sm" data-plan="'+i+'" type="button">管理</button></div></div>'}).join('');document.querySelectorAll('[data-plan]').forEach(function(b){b.onclick=function(){UI.toast('已打开：'+plans[Number(b.dataset.plan)].name)}})}document.querySelectorAll('[data-range]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-range]').forEach(function(x){x.classList.toggle('primary',x===b)});setTrend(Number(b.dataset.range))}});document.getElementById('createMarketing').onclick=function(){var n=prompt('请输入营销计划名称');if(!n||!n.trim())return;plans.unshift({name:n.trim(),type:'自定义活动',status:'草稿',rule:'待配置优惠规则',used:'0',sales:'$0'});renderPlans();UI.toast('营销计划已创建为草稿')};document.getElementById('quick').innerHTML=['配置运费模板','设置自动回复','管理店铺分类','添加子账号','查看操作日志','导出经营报表'].map(function(x){return '<button class="btn sm" type="button" data-quick="'+x+'">'+x+'</button>'}).join('');document.querySelectorAll('[data-quick]').forEach(function(b){b.onclick=function(){UI.toast(b.dataset.quick+'功能已打开')}});document.getElementById('saveAll').onclick=function(){UI.toast('店铺设置已保存')};setTrend(7);renderPlans();})();
</script></body></html>
