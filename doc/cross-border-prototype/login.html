<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>登录 · NovaCross 诺瓦跨境优选</title><link rel="stylesheet" href="assets/styles.css"></head><body data-surface="storefront" data-page="login"><header class="site-header" id="site-header"></header><main class="site-main"><div class="container section"><div class="auth-card panel"><div class="panel-body"><div class="eyebrow">NOVA CROSS ACCOUNT</div><h1 class="h2 mt-8">登录 NovaCross</h1><p class="muted">登录后查看订单、保存地址并管理账户。</p><form id="login-form" class="stack mt-24"><label class="field"><span>邮箱</span><input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com"><small class="error" id="email-error"></small></label><label class="field"><span>密码</span><input class="input" id="password" type="password" autocomplete="current-password" placeholder="至少 6 位字符"><small class="error" id="password-error"></small></label><label class="check-row"><input id="remember" type="checkbox" checked><span>保持登录</span></label><button class="btn primary lg block" type="submit">登录</button></form><div class="auth-demo tiny muted mt-16">演示账号：emily@example.com / 123456</div><p class="tiny muted mt-16">还没有账户？提交任意有效邮箱即可创建演示账户。</p></div></div></div></main><footer class="site-footer" id="site-footer"></footer><script src="assets/icons.js"></script><script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/app.js"></script><script src="assets/shell.js"></script><script>(function(){var form=document.getElementById('login-form');form.onsubmit=function(e){e.preventDefault();var email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value.trim(),ok=true;document.getElementById('email-error').textContent='';document.getElementById('password-error').textContent='';if(!/^\S+@\S+\.\S+$/.test(email)){document.getElementById('email-error').textContent='请输入有效邮箱';ok=false}if(password.length<6){document.getElementById('password-error').textContent='密码至少 6 位';ok=false}if(!ok)return;var users=JSON.parse(localStorage.getItem('nc_users')||'[]'),user=users.find(function(x){return x.email===email});if(!user){user={id:'U-'+Date.now(),name:email.split('@')[0],email:email,phone:'',addresses:[],createdAt:new Date().toISOString()};users.push(user);localStorage.setItem('nc_users',JSON.stringify(users))}localStorage.setItem('nc_session',JSON.stringify({userId:user.id,email:user.email,name:user.name,remember:document.getElementById('remember').checked,loginAt:new Date().toISOString()}));UI.toast('登录成功');setTimeout(function(){var next=new URLSearchParams(location.search).get('redirect')||'account.html';location.href=next},400)}})();</script></body></html>
