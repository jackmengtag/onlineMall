<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户与权限 · NovaCross</title><link rel="stylesheet" href="assets/styles.css"></head><body data-surface="platform" data-page="platform-users" data-title="用户与权限" data-crumb="平台治理 / 用户与权限"><aside class="app-nav" id="app-nav"></aside><div class="app-main"><header class="app-topbar" id="app-topbar"></header><main class="app-content"><div class="section-head"><div><div class="eyebrow">IDENTITY & ACCESS</div><h2 class="h1">用户与权限</h2><p class="lead">统一管理平台成员、店铺成员和角色授权。</p></div><button class="btn primary" id="invite">邀请成员</button></div><div class="grid cols-4 mb-24"><div class="kpi"><span class="kpi-label">成员总数</span><div class="kpi-value" id="kpi-total">0</div><span class="kpi-delta up">含待确认邀请</span></div><div class="kpi"><span class="kpi-label">平台管理员</span><div class="kpi-value" id="kpi-admin">0</div><span class="kpi-delta">最小权限原则</span></div><div class="kpi"><span class="kpi-label">店铺运营</span><div class="kpi-value" id="kpi-store">0</div><span class="kpi-delta">当前目录</span></div><div class="kpi"><span class="kpi-label">待确认邀请</span><div class="kpi-value" id="kpi-pending">0</div><span class="kpi-delta down">待跟进</span></div></div><section class="panel"><div class="panel-head"><div class="panel-title">成员目录</div><div class="seg" id="member-tabs"><button class="active" data-filter="all">全部</button><button data-filter="platform">平台成员</button><button data-filter="store">店铺成员</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>成员</th><th>归属</th><th>角色</th><th>最近登录</th><th>状态</th><th></th></tr></thead><tbody id="member-list"></tbody></table></div></section></main></div><div class="drawer-mask" id="drawer-mask"></div><aside class="drawer" id="member-drawer"><div class="drawer-head"><div><div class="eyebrow" id="drawer-eyebrow">INVITE MEMBER</div><h3 class="h2" id="drawer-title">邀请成员</h3></div><button class="btn ghost icon" id="drawer-close" aria-label="关闭">×</button></div><form class="drawer-body stack" id="member-form"><div class="field"><label for="member-name">姓名 <span class="mute2">必填</span></label><input class="input" id="member-name" required></div><div class="field"><label for="member-email">邮箱 <span class="mute2">必填</span></label><input class="input" id="member-email" type="email" required></div><div class="field"><label for="member-belong">归属</label><select class="select" id="member-belong"><option value="platform">平台组织</option><option value="store">NovaCross 官方旗舰店</option><option value="store">森野户外旗舰店</option></select></div><div class="field"><label for="member-role">角色</label><select class="select" id="member-role"><option>平台管理员</option><option>平台运营主管</option><option>店铺管理员</option><option>商品运营</option><option>客服专员</option></select></div><div class="field" id="scope-field"><label for="member-scope">权限范围</label><select class="select" id="member-scope"><option>全部平台数据</option><option>订单与售后</option><option>商品与库存</option><option>仅归属店铺</option></select></div><label class="switch-row" id="enabled-field"><span><b>启用成员</b><small>关闭后成员将无法访问平台。</small></span><span class="switch"><input type="checkbox" id="member-enabled" checked><i></i></span></label><div class="drawer-foot"><button type="button" class="btn" id="drawer-cancel">取消</button><button type="submit" class="btn primary">保存</button></div></form></aside><script src="assets/icons.js"></script><script src="assets/mock.js"></script><script src="assets/api.js"></script><script src="assets/app.js"></script><script src="assets/shell.js"></script><script>
(function(){
  var members=[
    {id:1,name:'杨琳',email:'yanglin@novacross.com',initials:'YL',type:'platform',belong:'平台组织',role:'平台运营主管',last:'今天 10:24',status:'active',scope:'全部平台数据',enabled:true},
    {id:2,name:'Lukas Müller',email:'lukas@novacross.com',initials:'LM',type:'store',belong:'NovaCross 官方旗舰店',role:'店铺管理员',last:'今天 09:48',status:'active',scope:'仅归属店铺',enabled:true},
    {id:3,name:'钱泽',email:'qianze@novacross.com',initials:'QZ',type:'store',belong:'森野户外旗舰店',role:'商品运营',last:'—',status:'pending',scope:'商品与库存',enabled:true}
  ];
  var currentFilter='all', editingId=null;
  var $=function(id){return document.getElementById(id)};
  function esc(value){return (window.FMT&&FMT.esc)?FMT.esc(value):String(value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  function toast(message,type){if(window.UI&&UI.toast){UI.toast(message,type||'info')}}
  function render(){
    var visible=members.filter(function(m){return currentFilter==='all'||m.type===currentFilter});
    $('member-list').innerHTML=visible.length?visible.map(function(m){var pending=m.status==='pending';var disabled=m.status==='disabled';return '<tr><td><div class="row"><span class="avatar">'+esc(m.initials)+'</span><div><b>'+esc(m.name)+'</b><small>'+esc(m.email)+'</small></div></div></td><td>'+esc(m.belong)+'</td><td>'+esc(m.role)+'</td><td>'+esc(m.last)+'</td><td><span class="badge '+(pending?'warning':disabled?'neutral':'success')+'"><i class="dt"></i>'+(pending?'待确认':disabled?'已停用':'正常')+'</span></td><td><div class="row" style="justify-content:flex-end"><button class="btn ghost sm" data-action="edit" data-id="'+m.id+'">权限</button>'+(pending?'<button class="btn ghost sm" data-action="resend" data-id="'+m.id+'">重发</button>': '<button class="btn ghost sm" data-action="toggle" data-id="'+m.id+'">'+(disabled?'启用':'停用')+'</button><button class="btn ghost sm" data-action="delete" data-id="'+m.id+'">删除</button>')+'</div></td></tr>'}).join(''):'<tr><td colspan="6"><div class="empty"><b>暂无成员</b><span>当前筛选下还没有成员。</span></div></td></tr>';
    $('kpi-total').textContent=members.length;$('kpi-admin').textContent=members.filter(function(m){return m.type==='platform'&&/管理员|主管/.test(m.role)&&m.status!=='disabled'}).length;$('kpi-store').textContent=members.filter(function(m){return m.type==='store'&&m.status!=='disabled'}).length;$('kpi-pending').textContent=members.filter(function(m){return m.status==='pending'}).length;
  }
  function openDrawer(id){editingId=id||null;var m=id&&members.find(function(x){return x.id===id});$('drawer-eyebrow').textContent=m?'EDIT ACCESS':'INVITE MEMBER';$('drawer-title').textContent=m?'编辑权限':'邀请成员';$('member-name').value=m?m.name:'';$('member-email').value=m?m.email:'';$('member-belong').value=m?m.type:'platform';$('member-role').value=m?m.role:'平台管理员';$('member-scope').value=m?m.scope:'全部平台数据';$('member-enabled').checked=m?m.enabled:true;$('member-email').disabled=!!m;$('enabled-field').style.display=m?'flex':'none';$('drawer-mask').classList.add('open');$('member-drawer').classList.add('open')}
  function closeDrawer(){$('drawer-mask').classList.remove('open');$('member-drawer').classList.remove('open');editingId=null}
  $('invite').onclick=function(){openDrawer()};$('drawer-close').onclick=closeDrawer;$('drawer-cancel').onclick=closeDrawer;$('drawer-mask').onclick=closeDrawer;
  $('member-tabs').onclick=function(e){var btn=e.target.closest('button');if(!btn)return;currentFilter=btn.dataset.filter;Array.prototype.forEach.call(this.children,function(b){b.classList.toggle('active',b===btn)});render()};
  $('member-list').onclick=function(e){var btn=e.target.closest('button');if(!btn)return;var id=Number(btn.dataset.id),m=members.find(function(x){return x.id===id});if(btn.dataset.action==='edit')openDrawer(id);if(btn.dataset.action==='resend'){toast('邀请已重新发送','success');m.last='刚刚';render()}if(btn.dataset.action==='toggle'){m.status=m.status==='disabled'?'active':'disabled';m.enabled=m.status==='active';toast(m.status==='active'?'成员已启用':'成员已停用','success');render()}if(btn.dataset.action==='delete'&&confirm('确定删除该成员？')){members=members.filter(function(x){return x.id!==id});toast('成员已删除','success');render()}};
  $('member-form').onsubmit=function(e){e.preventDefault();var name=$('member-name').value.trim(),email=$('member-email').value.trim().toLowerCase();if(!name||!email){toast('请填写姓名和邮箱','error');return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('请输入正确的邮箱格式','error');return}if(!editingId&&members.some(function(m){return m.email.toLowerCase()===email})){toast('该邮箱已存在，不能重复邀请','error');return}var type=$('member-belong').value,belong=$('member-belong').selectedOptions[0].textContent,role=$('member-role').value,scope=$('member-scope').value;if(editingId){var m=members.find(function(x){return x.id===editingId});m.name=name;m.type=type;m.belong=belong;m.role=role;m.scope=scope;m.enabled=$('member-enabled').checked;m.status=m.enabled?'active':'disabled';toast('权限已更新','success')}else{members.push({id:Date.now(),name:name,email:email,initials:name.split(/\s+/).map(function(x){return x[0]}).join('').slice(0,2).toUpperCase(),type:type,belong:belong,role:role,last:'—',status:'pending',scope:scope,enabled:true});toast('邀请已发送，等待成员确认','success')}closeDrawer();render()};
  render();
})();
</script></body></html>
