<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>订单详情 · NovaCross 诺瓦跨境优选</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-surface="storefront" data-page="orders">
  <header class="site-header" id="site-header"></header>

  <main class="site-main" id="app-content">
    <div class="container">
      <section class="section">
        <div id="orderDetail"></div>
      </section>
    </div>
  </main>

  <!-- 申请售后弹层 -->
  <div class="modal-mask" id="afsMask"></div>
  <div class="modal" id="afsModal">
    <div class="modal-head">
      <h3 class="h3">申请售后</h3>
      <button class="btn ghost icon" type="button" id="afsClose" title="关闭"></button>
    </div>
    <div class="modal-body stack">
      <div class="field">
        <label>售后类型</label>
        <div class="opts" id="afsType">
          <button class="opt" type="button" data-type="退货退款">退货退款</button>
          <button class="opt" type="button" data-type="换货">换货</button>
          <button class="opt" type="button" data-type="仅退款">仅退款</button>
        </div>
      </div>
      <div class="field">
        <label>售后原因</label>
        <select class="select" id="afsReason">
          <option value="">请选择售后原因</option>
          <option value="商品功能异常">商品功能异常</option>
          <option value="商品与描述不符">商品与描述不符</option>
          <option value="物流破损或丢件">物流破损或丢件</option>
          <option value="七天无理由退货">七天无理由退货</option>
          <option value="物流延误补偿">物流延误补偿</option>
          <option value="其他原因">其他原因</option>
        </select>
      </div>
      <div class="field">
        <label>问题描述</label>
        <textarea class="textarea" id="afsDesc" placeholder="请描述商品问题、收货情况与您的诉求（如退货退款金额、换货型号等）"></textarea>
      </div>
      <div class="field">
        <label>图片凭证</label>
        <div class="thumbs" id="afsThumbs"></div>
        <div class="tiny muted">点击方块可选择 / 取消（示例占位，最多 2 张）</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" type="button" id="afsCancel">取消</button>
      <button class="btn accent" type="button" id="afsSubmit">提交申请</button>
    </div>
  </div>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/icons.js"></script>
  <script src="assets/mock.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    /* =====================================================================
     * 订单详情 —— 数据：GET /api/storefront/orders/{orderNo}
     * 金额单位为分，展示统一走 FMT.money（除以 100）。
     * ===================================================================== */
    (function () {
      function param(name) {
        var m = new RegExp("[?&]" + name + "=([^&]+)").exec(location.search);
        return m ? decodeURIComponent(m[1]) : "";
      }
      function kv(k, v) { return '<div class="kv"><span>' + k + "</span><b>" + v + "</b></div>"; }
      function panel(title, glyph, body, id) {
        return '<section class="panel"' + (id ? ' id="' + id + '"' : "") + ">" +
          '<div class="panel-head"><div class="panel-title"><span class="panel-glyph">' + icon(glyph, { size: 16 }) + "</span>" + title + "</div></div>" +
          '<div class="panel-body">' + body + "</div>" +
        "</section>";
      }
      function timeline(items) {
        if (!items.length) return '<p class="muted">暂无状态记录</p>';
        return '<div class="timeline">' + items.map(function (it, i, arr) {
          var last = i === arr.length - 1;
          return '<div class="tl-item"><span class="tl-dot ' + (last ? "current" : "done") + '">' + icon("check", { size: 9 }) + "</span>" +
            '<div class="tl-title">' + it.title + "</div>" +
            (it.meta ? '<div class="tl-meta">' + it.meta + "</div>" : "") +
            (it.note ? '<div class="tl-note">' + it.note + "</div>" : "") +
          "</div>";
        }).join("") + "</div>";
      }

      var order = null;
      var thumbSel = [false, false];
      var afsType = "";

      var STATUS_STEP = {
        CREATED: 0, PENDING_PAYMENT: 0, PAID: 1, CONFIRMED: 2, FULFILLING: 3,
        SHIPPED: 4, IN_TRANSIT: 5, DELIVERED: 6, COMPLETED: 7, CANCELLED: -1
      };
      var STEP_DEF = ["订单创建", "支付成功", "订单确认", "履约中", "已发货", "运输中", "已妥投", "已完成"];

      var detailEl = document.getElementById("orderDetail");
      document.getElementById("afsClose").innerHTML = icon("x", { size: 18 });

      /* ---------- 顶部操作 ---------- */
      function actionsHtml(o) {
        var s = o.orderStatus, out = "";
        if (s === "PENDING_PAYMENT" || s === "CREATED") {
          out += '<button class="btn accent sm" type="button" data-pay>' + icon("credit-card", { size: 15 }) + "去支付</button>";
        } else if (s === "SHIPPED" || s === "IN_TRANSIT") {
          out += '<a class="btn primary sm" href="#tracking">' + icon("truck", { size: 15 }) + "查看物流</a>";
        }
        if ((s === "PAID" || s === "CONFIRMED" || s === "FULFILLING" || s === "SHIPPED" || s === "IN_TRANSIT" || s === "DELIVERED" || s === "COMPLETED")
          && (o.afterSaleStatus === "NONE" || !o.afterSaleStatus)) {
          out += '<button class="btn sm" type="button" data-afs>' + icon("refresh", { size: 15 }) + "申请售后</button>";
        }
        out += '<a class="btn ghost sm" href="orders.html">返回订单列表</a>';
        return out;
      }

      function headerHtml(o) {
        return '<div class="row between wrap mb-16" style="gap:12px">' +
          '<div class="row" style="gap:14px">' +
            '<a class="btn ghost sm" href="orders.html">' + icon("chevron-left", { size: 15 }) + "我的订单</a>" +
            '<div><div class="eyebrow">Order Detail</div>' +
              '<div class="row" style="gap:10px;margin-top:4px">' +
                '<span class="mono" style="font-size:15px;font-weight:600">' + FMT.esc(o.orderNo) + "</span>" +
                UI.badge(DB.ORDER_STATUS, o.orderStatus) +
              "</div>" +
            "</div>" +
          "</div>" +
          '<div class="row" style="gap:10px">' + actionsHtml(o) + "</div>" +
        "</div>";
      }

      /* ---------- 步骤条 ---------- */
      function stepsPanel(o) {
        var idx = STATUS_STEP[o.orderStatus];
        if (idx == null) idx = 0;
        var steps = STEP_DEF.map(function (label, i) {
          var cls = idx < 0 ? "" : (i < idx ? " done" : (i === idx ? " current" : ""));
          var sep = i < STEP_DEF.length - 1
            ? '<div class="step-sep' + (idx < 0 ? "" : (i < idx ? " done" : "")) + '"></div>' : "";
          return '<div class="step' + cls + '"><b>' + (i + 1) + "</b>" + label + "</div>" + sep;
        }).join("");
        var note = o.orderStatus === "CANCELLED"
          ? '<div class="tiny muted mt-12">订单已取消，履约流程终止，库存已释放。</div>' : "";
        return '<section class="panel mb-16">' +
          '<div class="panel-head"><div class="panel-title"><span class="panel-glyph">' + icon("truck", { size: 16 }) + "</span>订单进度</div>" +
            '<span class="tiny muted">下单时间 ' + FMT.esc(o.createTime || o.placedAt || "-") + "</span></div>" +
          '<div class="panel-body"><div class="steps">' + steps + "</div>" + note + "</div>" +
        "</section>";
      }

      /* ---------- 左列 ---------- */
      function leftCol(o) {
        var cur = o.currencyCode || FMT.currency();
        var items = (o.items || []).map(function (it) {
          var itemCur = it.currencyCode || cur;
          return '<div class="citem">' +
            UI.imgTag(it.image, it.name, "citem-img", it.name) +
            "<div>" +
              '<div class="citem-name">' + FMT.esc(it.name) + "</div>" +
              '<div class="citem-spec">' + FMT.esc(it.spec || it.sku || "默认规格") + "</div>" +
              '<div class="tiny muted mt-8">单价 ' + FMT.money(it.unit, itemCur) + "</div>" +
            "</div>" +
            '<div class="text-right">' +
              '<div class="tiny muted">× ' + it.qty + "</div>" +
              '<div class="price" style="font-size:15px">' + FMT.money(it.unit * it.qty, itemCur) + "</div>" +
            "</div>" +
          "</div>";
        }).join("");
        var a = o.amounts || {};
        var amt = '<div class="kv-list">' +
          kv("小计", FMT.money(a.subtotal, cur)) +
          kv("优惠", "- " + FMT.money(a.discount, cur)) +
          kv("运费", a.shipping ? FMT.money(a.shipping, cur) : "免运费") +
          kv("税费", FMT.money(a.tax, cur)) +
        "</div>" +
        '<div class="sum-row total"><span>合计</span><b>' + FMT.money(a.total, cur) + "</b></div>";

        return panel("商品与价格快照", "box", items || '<p class="muted">暂无商品明细</p>') + panel("金额明细", "wallet", amt);
      }

      /* ---------- 右列 ---------- */
      function rightCol(o) {
        var cur = o.currencyCode || FMT.currency();
        var sn = o.snapshot || {};

        var snapBody = '<div class="kv-list">' +
          kv("收件人", FMT.esc(sn.recipient || "-")) +
          kv("电话", FMT.esc(sn.phone || "-")) +
          kv("地址", FMT.esc(sn.addr || "-")) +
          kv("国家 / 地区", FMT.esc(sn.countryCode || o.countryCode || "-")) +
          kv("税费规则版本", FMT.esc(sn.taxRule || "-")) +
          kv("汇率版本", FMT.esc(sn.rateVer || "-")) +
        "</div>" +
        '<p class="sum-note">下单快照不可变：收货信息、税费规则与汇率均以支付时刻为准，用于跨境合规与对账追溯。</p>';

        var payBody = '<div class="kv-list">' +
          kv("支付状态", UI.badge(DB.PAY_STATUS, o.paymentStatus)) +
          kv("订单金额", FMT.money(o.totalAmount, cur)) +
          kv("结算币种", FMT.esc(cur)) +
          kv("支付时间", FMT.esc(o.paidAt || "-")) +
          kv("订单号", '<span class="mono">' + FMT.esc(o.orderNo) + "</span>") +
        "</div>";

        var fulBody = '<div class="kv-list">' +
          kv("履约状态", UI.badge(DB.FUL_STATUS, o.fulfillmentStatus)) +
          kv("售后状态", UI.badge(DB.AFS_STATUS, o.afterSaleStatus === "RESOLVED" ? "SUCCEEDED" : o.afterSaleStatus)) +
          kv("销售渠道", FMT.esc(o.channelCode || "-")) +
        "</div>" +
        '<p class="sum-note">履约与物流由卖家/仓库处理后同步，可在「我的订单」中查看最新进度。</p>';

        var trackBody = '<p class="muted">物流轨迹由承运商回传后展示，当前暂无运单信息。</p>';

        var histItems = (o.history || []).map(function (h) {
          return { title: FMT.esc(h.t), meta: FMT.esc(h.at || "") + (h.by ? " · " + FMT.esc(h.by) : ""), note: h.note ? FMT.esc(h.note) : "" };
        });

        return panel("收货与快照", "map-pin", snapBody) +
          panel("支付信息", "credit-card", payBody) +
          panel("履约信息", "warehouse", fulBody) +
          panel("物流信息", "truck", trackBody, "tracking") +
          panel("状态历史", "clock", timeline(histItems));
      }

      /* ---------- 渲染 ---------- */
      function render() {
        detailEl.innerHTML = headerHtml(order) + stepsPanel(order) +
          '<div class="two-col">' +
            '<div class="stack">' + leftCol(order) + "</div>" +
            '<div class="stack">' + rightCol(order) + "</div>" +
          "</div>";
        bind();
      }

      function bind() {
        var payBtn = UI.qs("[data-pay]", detailEl);
        if (payBtn) payBtn.addEventListener("click", function (e) { e.preventDefault(); pay(payBtn); });
        var afsBtn = UI.qs("[data-afs]", detailEl);
        if (afsBtn) afsBtn.addEventListener("click", function (e) { e.preventDefault(); openAfs(); });
      }

      /* ---------- 支付 ---------- */
      async function pay(btn) {
        btn.disabled = true;
        btn.innerHTML = icon("clock", { size: 15 }) + "支付中…";
        try {
          await API.payOrder(order.orderNo);
          UI.toast("支付成功");
          await load();
        } catch (e) {
          UI.toast(e.message || "支付失败，请稍后重试", "error");
          btn.disabled = false;
          btn.innerHTML = icon("credit-card", { size: 15 }) + "去支付";
        }
      }

      /* ---------- 售后弹层 ---------- */
      function openAfs() { UI.openModal("afsMask"); UI.openModal("afsModal"); }
      function closeAfs() { UI.closeModal("afsMask"); UI.closeModal("afsModal"); }

      function buildThumbs() {
        var wrap = document.getElementById("afsThumbs");
        wrap.innerHTML = [0, 1].map(function (i) {
          var on = thumbSel[i];
          return '<div data-thumb="' + i + '" style="width:44px;height:44px;border-radius:var(--r-sm);background:var(--surface-3);' +
            "border:2px solid " + (on ? "var(--brand-600)" : "var(--border)") + ';display:grid;place-items:center;color:var(--text-mute);cursor:pointer">' +
            icon("image", { size: 18 }) + "</div>";
        }).join("");
        UI.qsa("[data-thumb]", wrap).forEach(function (el) {
          el.addEventListener("click", function () {
            var i = parseInt(el.getAttribute("data-thumb"), 10);
            thumbSel[i] = !thumbSel[i];
            buildThumbs();
          });
        });
      }

      function resetAfs() {
        afsType = "";
        thumbSel = [false, false];
        UI.qsa("[data-type]", document.getElementById("afsType")).forEach(function (b) { b.classList.remove("on"); });
        document.getElementById("afsReason").value = "";
        document.getElementById("afsDesc").value = "";
        buildThumbs();
      }

      async function submitAfs() {
        var reason = document.getElementById("afsReason").value;
        var desc = document.getElementById("afsDesc").value.trim();
        if (!afsType) { UI.toast("请选择售后类型", "error"); return; }
        if (!reason) { UI.toast("请选择售后原因", "error"); return; }
        var btn = document.getElementById("afsSubmit");
        btn.disabled = true;
        btn.innerHTML = icon("clock", { size: 15 }) + "提交中…";
        try {
          await API.submitAftersale({
            orderNo: order.orderNo,
            amount: order.totalAmount,
            reason: desc ? reason + "：" + desc : reason,
            type: afsType
          });
          UI.toast("售后申请已提交");
          closeAfs();
          resetAfs();
          await load();
        } catch (e) {
          UI.toast(e.message || "提交失败，请稍后重试", "error");
        } finally {
          btn.disabled = false;
          btn.innerHTML = "提交申请";
        }
      }

      function handleHash() {
        var h = location.hash;
        if (h === "#tracking") {
          var t = document.getElementById("tracking");
          if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
        } else if (h === "#afs") {
          openAfs();
        }
      }

      function skeleton() {
        return '<div class="skel" style="width:280px;height:26px;margin-bottom:18px"></div>' +
          '<div class="panel mb-16"><div class="panel-body"><div class="skel" style="width:100%;height:24px"></div></div></div>' +
          '<div class="two-col">' +
            '<div class="stack">' +
              '<div class="panel"><div class="panel-body stack"><div class="skel" style="width:40%"></div>' +
                '<div class="row" style="gap:12px"><div class="skel" style="width:76px;height:76px"></div>' +
                '<div class="stack" style="flex:1;gap:8px"><div class="skel" style="width:60%"></div><div class="skel" style="width:35%"></div></div></div></div></div>' +
              '<div class="panel"><div class="panel-body stack"><div class="skel" style="width:30%"></div><div class="skel" style="width:100%"></div><div class="skel" style="width:80%"></div></div></div>' +
            "</div>" +
            '<div class="stack">' +
              '<div class="panel"><div class="panel-body stack"><div class="skel" style="width:50%"></div><div class="skel" style="width:90%"></div><div class="skel" style="width:70%"></div></div></div>' +
              '<div class="panel"><div class="panel-body stack"><div class="skel" style="width:45%"></div><div class="skel" style="width:85%"></div></div></div>' +
            "</div>" +
          "</div>";
      }

      function emptyHtml(msg) {
        return '<div class="empty"><div class="empty-glyph">' + icon("receipt", { size: 24 }) + "</div>" +
          "<b>" + FMT.esc(msg || "订单不存在") + "</b>" +
          '<span class="tiny">该订单可能已被删除，或链接已失效</span>' +
          '<a class="btn accent sm mt-8" href="orders.html">返回我的订单</a></div>';
      }

      async function load() {
        detailEl.innerHTML = skeleton();
        try {
          var res = await API.fetchOrder(no);
          order = res.data;
          render();
          handleHash();
        } catch (e) {
          detailEl.innerHTML = emptyHtml(e.message || "订单加载失败");
        }
      }

      var no = param("no");

      async function init() {
        if (!UI.requireAuth("order.html" + location.search)) return;
        buildThumbs();
        UI.qsa("[data-type]", document.getElementById("afsType")).forEach(function (b) {
          b.addEventListener("click", function () {
            afsType = b.getAttribute("data-type");
            UI.qsa("[data-type]", document.getElementById("afsType")).forEach(function (x) { x.classList.remove("on"); });
            b.classList.add("on");
          });
        });
        document.getElementById("afsClose").addEventListener("click", function () { closeAfs(); resetAfs(); });
        document.getElementById("afsCancel").addEventListener("click", function () { closeAfs(); resetAfs(); });
        document.getElementById("afsSubmit").addEventListener("click", submitAfs);
        document.getElementById("afsMask").addEventListener("click", function () { closeAfs(); resetAfs(); });
        window.addEventListener("hashchange", handleHash);

        if (!no) { detailEl.innerHTML = emptyHtml("缺少订单号"); return; }
        await load();
      }

      init();
    })();
  </script>
</body>
</html>
