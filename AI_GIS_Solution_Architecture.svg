<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#0B7285"/></marker><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".14"/></filter></defs>
<rect width="1400" height="850" fill="#F7FAFC"/><text x="70" y="65" font-family="Arial" font-size="31" font-weight="700" fill="#16324F">AI / GIS Decision Intelligence — Reference Architecture</text><text x="70" y="98" font-family="Arial" font-size="17" fill="#4B5563">From spatial data to measurable decisions, with monitoring and human review built in</text>
<g font-family="Arial" filter="url(#s)"><rect x="70" y="150" rx="16" width="250" height="180" fill="#EAF4F4" stroke="#0B7285" stroke-width="2"/><text x="95" y="190" font-size="21" font-weight="700" fill="#16324F">Data Sources</text><text x="95" y="225" font-size="16" fill="#243447">• GIS layers &amp; boundaries</text><text x="95" y="253" font-size="16" fill="#243447">• Remote sensing / imagery</text><text x="95" y="281" font-size="16" fill="#243447">• IoT, weather, operations</text><text x="95" y="309" font-size="16" fill="#243447">• Historical outcomes</text>
<rect x="390" y="150" rx="16" width="270" height="180" fill="#FFFFFF" stroke="#0B7285" stroke-width="2"/><text x="415" y="190" font-size="21" font-weight="700" fill="#16324F">Spatial Data Pipeline</text><text x="415" y="225" font-size="16" fill="#243447">• Ingest, validate, version</text><text x="415" y="253" font-size="16" fill="#243447">• CRS / geometry handling</text><text x="415" y="281" font-size="16" fill="#243447">• Feature engineering</text><text x="415" y="309" font-size="16" fill="#243447">• Reproducible datasets</text>
<rect x="730" y="150" rx="16" width="270" height="180" fill="#FFFFFF" stroke="#0B7285" stroke-width="2"/><text x="755" y="190" font-size="21" font-weight="700" fill="#16324F">ML / AI Layer</text><text x="755" y="225" font-size="16" fill="#243447">• Baseline + candidate models</text><text x="755" y="253" font-size="16" fill="#243447">• Spatial validation</text><text x="755" y="281" font-size="16" fill="#243447">• Confidence &amp; explanations</text><text x="755" y="309" font-size="16" fill="#243447">• Batch / real-time inference</text>
<rect x="1070" y="150" rx="16" width="260" height="180" fill="#EAF4F4" stroke="#0B7285" stroke-width="2"/><text x="1095" y="190" font-size="21" font-weight="700" fill="#16324F">Decision Services</text><text x="1095" y="225" font-size="16" fill="#243447">• Python API</text><text x="1095" y="253" font-size="16" fill="#243447">• GIS / dashboard view</text><text x="1095" y="281" font-size="16" fill="#243447">• Alerts &amp; workflows</text><text x="1095" y="309" font-size="16" fill="#243447">• Human approval gates</text></g>
<g stroke="#0B7285" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M320 240 H385"/><path d="M660 240 H725"/><path d="M1000 240 H1065"/></g>
<g font-family="Arial" filter="url(#s)"><rect x="170" y="465" rx="16" width="310" height="185" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="195" y="505" font-size="21" font-weight="700" fill="#16324F">Evaluation &amp; Governance</text><text x="195" y="540" font-size="16" fill="#243447">• Offline metrics &amp; error analysis</text><text x="195" y="568" font-size="16" fill="#243447">• Bias / drift / data quality</text><text x="195" y="596" font-size="16" fill="#243447">• Audit trail &amp; model registry</text><text x="195" y="624" font-size="16" fill="#243447">• Security and access controls</text>
<rect x="545" y="465" rx="16" width="310" height="185" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="570" y="505" font-size="21" font-weight="700" fill="#16324F">Operations &amp; Monitoring</text><text x="570" y="540" font-size="16" fill="#243447">• Logs, traces, latency</text><text x="570" y="568" font-size="16" fill="#243447">• Model / feature drift</text><text x="570" y="596" font-size="16" fill="#243447">• Retraining triggers</text><text x="570" y="624" font-size="16" fill="#243447">• Deployment rollback</text>
<rect x="920" y="465" rx="16" width="310" height="185" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="945" y="505" font-size="21" font-weight="700" fill="#16324F">Stakeholder Feedback</text><text x="945" y="540" font-size="16" fill="#243447">• Review predictions</text><text x="945" y="568" font-size="16" fill="#243447">• Correct labels / outcomes</text><text x="945" y="596" font-size="16" fill="#243447">• Improve thresholds</text><text x="945" y="624" font-size="16" fill="#243447">• Feed validated data back</text></g>
